<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub-Programa - Sistema de Cubicaciones de Planificación</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gray-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Icons
        const Icon = ({ name }) => {
            const icons = {
                dashboard: "📊", cubicaciones: "📐", mantenedores: "⚙️",
                edit: "✏️", delete: "🗑️", save: "💾", add: "➕",
                close: "✕", check: "✓", search: "🔍", upload: "📤",
                download: "📥", file: "📄", warning: "⚠️", info: "ℹ️",
                back: "←", next: "→", refresh: "🔄", filter: "🔽",
                success: "✅", error: "❌", chevronDown: "▼", chevronUp: "▲",
                link: "🔗", copy: "📋", eye: "👁️", eyeOff: "🙈",
                calendar: "📅", clock: "🕐", user: "👤", users: "👥",
                building: "🏢", chart: "📈", planificacion: "📋",
                partidas: "📑", gantt: "📊", matrizMC: "🔗",
            };
            return icons[name] || "•";
        };

        const useLocalStorageState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = localStorage.getItem(key);
                    if (item) {
                        const parsed = JSON.parse(item);
                        if (Array.isArray(initialValue) && !Array.isArray(parsed)) return initialValue;
                        return parsed;
                    }
                    return initialValue;
                } catch (error) { return initialValue; }
            });
            useEffect(() => {
                try { localStorage.setItem(key, JSON.stringify(state)); }
                catch (error) { console.error('Error saving to localStorage', error); }
            }, [key, state]);
            return [state, setState];
        };

        const CubProgramaPage = ({ actividades, setActividades, unidades, proyectos, ponderaciones, especialidades, itemizadosPorProyecto, programasPorProyecto, showSuccess, askConfirm }) => {
            const { useState, useEffect } = React;
            
            const [activeProject, setActiveProject] = useState('');
            const [activeEspecialidadFilter, setActiveEspecialidadFilter] = useState('');
            const [activeActivityFilter, setActiveActivityFilter] = useState('');
            const activeTab = 'fisico'; // CUB-PROGRAMA: solo AVANCE FÍSICO
            const [infoColumns, setInfoColumns] = useState(() => {
                const saved = localStorage.getItem('cubprograma_info_columns');
                const base = ['Item', 'Descripción', 'Elemento', 'Ubicación'];
                if (!saved) return base;
                const parsed = JSON.parse(saved);
                
                // Normalizar nombres antiguos (mayúsculas) para evitar duplicados
                const nameMap = {
                    'ITEM': 'Item',
                    'DESCRIPCIÓN': 'Descripción',
                    'DESCRIPCION': 'Descripción',
                    'DESCRIPCIÓN DEL ITEM': 'Descripción',
                    'ELEMENTO': 'Elemento',
                    'UBICACIÓN': 'Ubicación',
                    'UBICACION': 'Ubicación'
                };
                
                let merged = parsed.map(col => nameMap[col.toUpperCase()] || col);
                
                // Eliminar duplicados manteniendo primera aparición
                merged = merged.filter((item, pos) => merged.indexOf(item) === pos);

                // Migration: ensure 'Item' and 'Descripción' always exist
                if (!merged.includes('Item')) merged.unshift('Item');
                if (!merged.includes('Descripción')) merged.splice(1, 0, 'Descripción');
                
                return merged;
            });
            const [newColName, setNewColName] = useState('');
            const [showNewColForm, setShowNewColForm] = useState(false);
            const [itemizadoSearch, setItemizadoSearch] = useState('');
            const [showItemizadoDropdown, setShowItemizadoDropdown] = useState(false);
            const [edpItemFilter, setEdpItemFilter] = useState('');

            // Persistir orden de columnas
            React.useEffect(() => {
                localStorage.setItem('cubprograma_info_columns', JSON.stringify(infoColumns));
            }, [infoColumns]);

            const moveColumn = (index, direction) => {
                const newCols = [...infoColumns];
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= newCols.length) return;
                const temp = newCols[index];
                newCols[index] = newCols[newIndex];
                newCols[newIndex] = temp;
                setInfoColumns(newCols);
            };

            const removeColumn = (col) => {
                if (['Elemento', 'Ubicación'].includes(col)) return; // Columnas base no se borran
                setInfoColumns(infoColumns.filter(c => c !== col));
            };

            const [rows, setRows] = useState([]);
            const [hoveredCol, setHoveredCol] = useState(null);
            const [dragSubIdx, setDragSubIdx] = useState(null); // índice de la columna que se está arrastrando
            const [dragOverSubIdx, setDragOverSubIdx] = useState(null); // índice donde se está sobrevolando
            
            // Estado para el popup de adjuntar documentos
            const [uploadModal, setUploadModal] = useState({ show: false, rowId: null, type: 'Plano', file: null, activeFilter: 'Todos' });

            const handleDownloadAttachment = (att) => {
                if (!att.data) {
                    alert("⚠️ Este documento fue adjunto sin datos de descarga (versión anterior). Debe volver a adjuntarlo para poder descargarlo.");
                    return;
                }
                const link = document.createElement('a');
                link.href = att.data;
                link.download = att.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleAddAttachment = () => {
                if (!uploadModal.file) {
                    alert("⚠️ Debe seleccionar un archivo primero.");
                    return;
                }

                const file = uploadModal.file;
                const filename = file.name;
                const docType = uploadModal.type;

                const saveAttachment = (fileData) => {
                    setRows(prevRows => {
                        const newRows = prevRows.map(r => {
                            if (r.id === uploadModal.rowId) {
                                const currentAttachments = r.attachments || [];
                                return {
                                    ...r,
                                    attachments: [{ 
                                        name: filename, 
                                        type: docType, 
                                        data: fileData,
                                        date: new Date().toLocaleDateString('es-CL') + ' ' + new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })
                                    }, ...currentAttachments]
                                };
                            }
                            return r;
                        });
                        
                        const key = `cubprograma_data_${activeProject}_${activeActivityFilter}`;
                        try {
                            localStorage.setItem(key, JSON.stringify(newRows));
                            setTimeout(() => {
                                setUploadModal({ show: false, rowId: null, type: 'Plano', file: null, activeFilter: 'Todos' });
                                showSuccess(`✓ Documento "${filename}" adjunto correctamente.`);
                            }, 50);
                            return newRows;
                        } catch (e) {
                            alert("❌ El archivo excede la memoria local disponible en su navegador. Por favor suba un PDF más liviano, o borre otros documentos adjuntos para liberar espacio.");
                            return prevRows; // Cancel state update to prevent UI crash
                        }
                    });
                };

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxDimension = 800; // Reducido de 1000 para ahorrar espacio
                            
                            if (width > height && width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            } else if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            // Bajamos calidad a 0.4 para documentos de prueba
                            const compressedData = canvas.toDataURL('image/jpeg', 0.4);
                            saveAttachment(compressedData);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = e.target.result;
                        // Si es PDF muy pesado (> 1.5MB), advertir
                        if (data.length > 1.5 * 1024 * 1024) {
                            if (!confirm("⚠️ El archivo es bastante pesado y podría superar la capacidad de almacenamiento del navegador. ¿Desea intentar subirlo de todas formas?")) {
                                return;
                            }
                        }
                        saveAttachment(data);
                    };
                    reader.onerror = () => alert("❌ Error al leer el documento.");
                    reader.readAsDataURL(file);
                }
            };
            
            const isEmptyRow = (r) => {
                const hasFisico = Object.values(r.subActivityProgress || {}).some(val => val !== '' && val !== null);
                const hasEDP = Object.values(r.subActivityProgressEDP || {}).some(val => val !== '' && val !== null);
                if (hasFisico || hasEDP) return false;
                for (const [k, v] of Object.entries(r.mathParams || {})) {
                    if (k === 'cantidad') {
                        if (v !== 1 && v !== '1' && v !== '') return false;
                    } else {
                        if (v !== '' && v !== null) return false;
                    }
                }
                return true;
            };

            // Función de padding eliminada para mostrar solo filas con datos
            const getOneEmptyRow = (actId, unitId) => {
                return {
                    id: Date.now(),
                    attachments: [],
                    infoFields: {},
                    actividadId: actId || '',
                    unidadId: unitId || '',
                    partidaId: '',
                    mathParams: { cantidad: 1, valorManual: '' },
                    subActivityProgress: {},
                    subActivityProgressEDP: {}
                };
            };

            // Cargar datos por Obra y Actividad
            useEffect(() => {
                if (activeProject && activeActivityFilter) {
                    const actId = parseInt(activeActivityFilter);
                    const actObj = actividades.find(a => a.id === actId);
                    const unitId = actObj ? actObj.unidadId : '';

                    const key = `cubprograma_data_${activeProject}_${activeActivityFilter}`;
                    const savedData = localStorage.getItem(key);
                    let loadedRows = [];
                    if (savedData) {
                        try {
                            loadedRows = JSON.parse(savedData);
                            
                            // Validar y actualizar si la unidad de la actividad cambió en el mantenedor
                            loadedRows = loadedRows.map(r => {
                                if (r.actividadId === actId && r.unidadId !== unitId) {
                                    return {
                                        ...r,
                                        unidadId: unitId,
                                        mathParams: { cantidad: r.mathParams?.cantidad || 1 }, 
                                        subActivityProgress: {} // Limpiar avance ya que la base de la unidad acaba de ser reiniciada
                                    };
                                }
                                return r;
                            });

                        } catch(e) { }
                    }
                    // Si no hay datos, mostrar una tabla completamente vacía hasta que el usuario añada.
                    setRows(loadedRows);
                } else {
                    setRows([]);
                }
            }, [activeProject, activeActivityFilter]);

            // Sincronizar el formulario con la Actividad seleccionada
            useEffect(() => {
                if (activeActivityFilter) {
                    const actId = parseInt(activeActivityFilter);
                    const actObj = actividades.find(a => a.id === actId);
                    if (actObj) {
                        setFormData(prev => ({
                            ...prev,
                            actividadId: actId,
                            unidadId: actObj.unidadId || ''
                        }));
                    }
                }
            }, [activeActivityFilter, actividades]);

            const handleSaveGeneral = () => {
                if (!activeProject || !activeActivityFilter) {
                    alert('Debe seleccionar Obra y Actividad para guardar.');
                    return;
                }
                const rowsToSave = rows.filter(r => !isEmptyRow(r));
                
                // VALIDACIÓN DE CAMPOS OBLIGATORIOS
                const requiredFields = ['Item', 'Descripción', 'Ubicación', 'Elemento'];
                let hasErrors = false;
                for (let i = 0; i < rowsToSave.length; i++) {
                    const r = rowsToSave[i];
                    for (const req of requiredFields) {
                        const val = r.infoFields[req];
                        if (val === undefined || val === null || val.toString().trim() === '') {
                            const rowDisplayNum = rows.findIndex(row => row.id === r.id) + 1;
                            alert(`❌ Error al guardar.\nFila N°${rowDisplayNum}: El campo obligatorio "${req}" está vacío.\nDebe completarlo para continuar.`);
                            hasErrors = true;
                            break;
                        }
                    }
                    if (hasErrors) break;
                }
                if (hasErrors) return;

                const key = `cubprograma_data_${activeProject}_${activeActivityFilter}`;
                localStorage.setItem(key, JSON.stringify(rowsToSave));
                alert('✔ Avance guardado exitosamente para la obra y actividad actual.');
            };

            const exportToExcel = () => {
                if (rows.length === 0) return alert('No hay datos para exportar');
                const wsData = [];
                // Cabeceras
                const headers = ['#', ...infoColumns, 'Actividad', 'Unidad', 'Cant.'];
                
                let maxParams = 0;
                rows.forEach(r => {
                    const unitObj = unidades.find(u => u.id === r.unidadId);
                    if (unitObj && unitObj.params.length > maxParams) maxParams = unitObj.params.length;
                });
                for(let i=0; i<maxParams; i++) headers.push(`Param ${i+1}`);
                headers.push('Takeoff Total');
                headers.push('Avance EDP');
                headers.push('% Avance EDP');
                headers.push('Avance Físico');
                headers.push('% Avance Físico');
                
                wsData.push(headers);
                
                rows.forEach((r, idx) => {
                    const rowData = [idx + 1];
                    infoColumns.forEach(c => rowData.push(r.infoFields[c] || '-'));
                    const actObj = actividades.find(a => a.id === r.actividadId);
                    const unitObj = unidades.find(u => u.id === r.unidadId);
                    
                    rowData.push(actObj ? actObj.nombre : '-');
                    rowData.push(unitObj ? unitObj.name : '-');
                    rowData.push(r.mathParams.cantidad || '0');
                    
                    for(let i=0; i<maxParams; i++) {
                        if (unitObj && unitObj.params[i]) {
                            rowData.push(r.mathParams[unitObj.params[i]] || '0');
                        } else {
                            rowData.push('-');
                        }
                    }
                    const totalTakeoff = calculateTakeoff(r);
                    const execP = calculateExecutedQty(r, actObj, 'parcial');
                    const execR = calculateExecutedQty(r, actObj, 'real');
                    
                    rowData.push(totalTakeoff.toFixed(2));
                    rowData.push(execP.toFixed(2));
                    rowData.push(totalTakeoff > 0 ? ((execP / totalTakeoff) * 100).toFixed(2) + '%' : '-');
                    rowData.push(execR.toFixed(2));
                    rowData.push(totalTakeoff > 0 ? ((execR / totalTakeoff) * 100).toFixed(2) + '%' : '-');
                    
                    wsData.push(rowData);
                });

                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Cubicaciones");
                XLSX.writeFile(wb, `Cubicaciones_${activeProject}_${activeActivityFilter}.xlsx`);
            };

            const exportToPDF = async () => {
                const activeRows = (activeTab === 'edp' && edpItemFilter)
                    ? rows.filter(r => r.infoFields['Item'] === edpItemFilter)
                    : rows;

                if (activeRows.length === 0) return alert('No hay datos para exportar en EDP.');

                const btn = document.getElementById('btn-export-pdf');
                const prevText = btn.innerHTML;
                btn.innerHTML = '<span>⏳</span> Generando...';
                btn.disabled = true;

                try {

                    // Encontrar el máximo de Subactividades EDP para definir columnas dinámicas si es necesario
                    let maxSubActividades = 1;
                    activeRows.forEach(row => {
                        const act = actividades.find(a => a.id === row.actividadId);
                        if (act && act.subActividades) {
                            const groupsList = [];
                            act.subActividades.forEach(s => {
                                const gName = (s.grupoEDP || s.nombre || '').trim();
                                let g = groupsList.find(x => x.name === gName);
                                if (!g) { g = { name: gName, weight: 0 }; groupsList.push(g); }
                                g.weight += (parseFloat(s.porcentajeEDP) || 0);
                            });
                            const nGroups = groupsList.filter(g => g.weight > 0).length;
                            if (nGroups > maxSubActividades) maxSubActividades = nGroups;
                        }
                    });

                    // Excluir la columna Ubicación para ahorrar ancho en el PDF
                    const printCols = infoColumns.filter(c => c !== 'Ubicación' && c !== 'Ubicacion');

                    // 1. Identificar todos los grupos únicos presentes en las filas activas para crear columnas fijas
                    const uniqueGroups = [];
                    activeRows.forEach(row => {
                        const act = actividades.find(a => a.id === row.actividadId);
                        if (act && act.subActividades) {
                            const groupsMap = {};
                            act.subActividades.forEach(s => {
                                const gName = (s.grupoEDP || s.nombre || '').trim();
                                const weight = parseFloat(s.porcentajeEDP) || 0;
                                if (weight > 0) {
                                    if (!groupsMap[gName]) groupsMap[gName] = 0;
                                    groupsMap[gName] += weight;
                                }
                            });
                            Object.keys(groupsMap).forEach(gn => {
                                if (!uniqueGroups.find(x => x.name === gn)) {
                                    uniqueGroups.push({ name: gn, weight: groupsMap[gn] });
                                }
                            });
                        }
                    });

                    // Construimos la tabla desde cero en HTML puro
                    let htmlData = `
                        <div style="margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
                            <h1 style="color: #0f172a; margin: 0; font-size: 24px;">ESTADO DE PAGO: AVANCE CUBICACIONES</h1>
                            <p style="color: #64748b; margin: 5px 0 0 0; font-size: 14px;">Emisión: ${new Date().toLocaleDateString('es-CL')} - Ítem: ${edpItemFilter || 'Todos'}</p>
                        </div>
                        <table class="pdf-table" style="border: 1px solid #cbd5e1; font-size: 8px;">
                            <thead>
                                <tr style="background-color: #f1f5f9; color: #334155; text-align: left; border-bottom: 2px solid #94a3b8; font-size: 8px;">
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; text-align: center; font-size: 8px;">#</th>
                    `;
                    
                    for (const col of printCols) {
                        htmlData += `<th style="padding: 3px; border: 1px solid #cbd5e1; font-size: 8px;">${col.toUpperCase()}</th>`;
                    }
                    htmlData += `
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; font-size: 8px;">ACTIVIDAD</th>
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; text-align: center; font-size: 8px;">UNID</th>
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; text-align: center; font-size: 8px;">PARÁMETROS</th>
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; text-align: center; font-size: 8px;">CANT</th>
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; background-color: #ecfdf5; text-align: center; font-size: 8px;">CANT. TOTAL</th>
                    `;

                    // Agregar columnas dinámicas de sub-actividades en el header
                    uniqueGroups.forEach(ug => {
                        htmlData += `<th style="padding: 3px; border: 1px solid #cbd5e1; background-color: #fef3c7; text-align: center; font-size: 7px;">${ug.name.toUpperCase()}<br/>(${ug.weight}%)</th>`;
                    });

                    htmlData += `
                                    <th style="padding: 3px; border: 1px solid #cbd5e1; background-color: #eff6ff; text-align: center; font-size: 8px;">AVANCE EDP</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    activeRows.forEach((row, idx) => {
                        const actividadObj = actividades.find(a => a.id === row.actividadId);
                        const unidadObj = unidades.find(u => u.id === row.unidadId);
                        const totalTakeoff = calculateTakeoff(row);
                        const execP = calculateExecutedQty(row, actividadObj, 'parcial');
                        
                        // Preparar sub-actividades de la fila
                        const rowGroups = {};
                        if (actividadObj && actividadObj.subActividades) {
                            actividadObj.subActividades.forEach(s => {
                                const gn = (s.grupoEDP || s.nombre || '').trim();
                                if (!rowGroups[gn]) rowGroups[gn] = [];
                                rowGroups[gn].push(s);
                            });
                        }
                        const rowProgressData = row.subActivityProgress || {};
                        htmlData += `
                            <tr style="border-bottom: 1px solid #e2e8f0; page-break-inside: avoid; font-size: 8px;">
                                <td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; font-size: 8px;">${idx + 1}</td>
                        `;
                        for (const col of printCols) {
                            htmlData += `<td style="padding: 3px; border: 1px solid #e2e8f0; font-size: 8px;">${row.infoFields[col] || '-'}</td>`;
                        }
                        
                        // Generar string de parámetros como fórmula (ex: 2 x 5 x 1)
                        let paramStr = '-';
                        if (unidadObj && unidadObj.params && unidadObj.params.length > 0) {
                            paramStr = unidadObj.params.map(p => {
                                const val = row.mathParams[p];
                                return (val !== undefined && val !== '') ? val : '';
                            }).filter(x => x !== '').join(' x ');
                        }

                        // Generar columnas dinámicas según los grupos globales identificados
                        let subActHTML = '';
                            for (let i = 0; i < uniqueGroups.length; i++) {
                                const ug = uniqueGroups[i];
                                const subs = rowGroups[ug.name];
                                if (subs && subs.length > 0) {
                                    const physicallyDone = subs.every(s => parseFloat(rowProgressData[s.id]) > 0);
                                    if (physicallyDone) {
                                        const vals = subs.map(s => parseFloat(rowProgressData[s.id]) || 0);
                                        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
                                        const valStr = avg.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                        subActHTML += `<td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; font-size: 8px; color: #78350f;">${valStr}</td>`;
                                    } else {
                                        // Si falta el avance físico de alguna sub-actividad del grupo, el EDP no pasa (se muestra -)
                                        subActHTML += `<td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; color: #cbd5e1; font-size: 8px;">-</td>`;
                                    }
                                } else {
                                    subActHTML += `<td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; color: #cbd5e1; font-size: 8px;">-</td>`;
                                }
                            }

                        htmlData += `
                                <td style="padding: 3px; border: 1px solid #e2e8f0; font-size: 8px;">${actividadObj ? actividadObj.nombre : '-'}</td>
                                <td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; color: #047857; font-weight: bold; font-size: 8px;">${unidadObj ? (unidadObj.abrev || unidadObj.name.substring(0,5)) : '-'}</td>
                                <td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; font-size: 8px;">${paramStr}</td>

                            </tbody>

                    // Envolver todo en un div maestro que use el ancho de página pero controle la tipografía

                    <div class="pdf-print-container">` + htmlData;

                    // HTML para documentos fotográficos / imágenes estructuradas
                    const pdfBase64List = [];
                    const orderBy = { 'Plano': 1, 'Protocolo': 2, 'Fotografía': 3, 'Otros Documentos': 4 };
                    
                    for (const r of activeRows) {
                        if (!r.attachments || r.attachments.length === 0) continue;
                        
                        const cod = r.infoFields['Item'] || '-';
                        const desc = r.infoFields['Descripción'] || r.infoFields['Descripcion'] || '-';
                        
                        // Solo conservar el último documento (el más reciente, índice 0) por cada tipo
                        const latestByType = {};
                        for (const att of r.attachments) {
                            if (!latestByType[att.type]) {
                                latestByType[att.type] = att;
                            }
                        }
                        
                        const sortedAtts = Object.values(latestByType).sort((a,b) => orderBy[a.type] - orderBy[b.type]);

                        for (const att of sortedAtts) {
                            if (!att.data) continue;
                            if (att.data.startsWith('data:application/pdf')) {
                                pdfBase64List.push(att.data);
                            } else if (att.data.startsWith('data:image')) {
                                fullHTML += `<div class="html2pdf__page-break" style="page-break-before: always;"></div>`;
                                fullHTML += `
                                    <div style="padding: 10px; height: 750px; box-sizing: border-box; background-color: white;">
                                        <div style="border: 2px solid #1e293b; padding: 20px; border-radius: 12px; height: 100%; display: flex; flex-direction: column;">
                                            <div style="border-bottom: 3px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end;">

                                                    <p style="font-size: 14px; color: #3b82f6; margin: 4px 0 0 0; font-weight: 700;">Ítem: ${cod}</p>
                                                    <p style="font-size: 12px; color: #475569; margin: 2px 0 0 0;">${desc}</p>
                                                </div>
                                                <div style="text-align: right;">
                                                    <p style="font-size: 10px; color: #94a3b8; font-weight: 700; margin: 0;">SISTEMA DE CUBICACIONES</p>
                                                    <p style="font-size: 10px; color: #cbd5e1; margin: 2px 0 0 0;">${att.name || 'Documento adjunto'}</p>
                                                </div>
                                            </div>
                                            <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background-color: #f8fafc; border-radius: 8px;">
                                                <img src="${att.data}" style="max-width: 500px; max-height: 400px; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);" />
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                        }
                    }

                    fullHTML += `</div>`; // Cerrar div maestro temporal

                    const opt = {
                        margin:       [0.2, 0.2, 0.2, 0.2],
                        filename:     `Cubicaciones_EDP_${activeProject}_${activeActivityFilter}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, logging: false },
                        jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' },
                        pagebreak:    { mode: 'css', before: '.html2pdf__page-break' }
                    };

                    // Al pasar el HTML en string, html2pdf.from() internamente procesará 
                    // las <img base64> y renderizará garantizando visibilidad.
                    if (!window.PDFLib) {
                        await html2pdf().set(opt).from(fullHTML).save();
                        btn.innerHTML = prevText;
                        btn.disabled = false;
                        return;
                    }

                    // Exportar PDF a ArrayBuffer puro usando html2pdf
                    const basePdfBuffer = await html2pdf().set(opt).from(fullHTML).outputPdf('arraybuffer');

                    // Inicializar PDF-lib
                    const { PDFDocument } = window.PDFLib;
                    const pdfDoc = await PDFDocument.load(basePdfBuffer);

                    // Unir PDFs adjuntos
                    for (const pdfB64 of pdfBase64List) {
                        try {
                            const base64Data = pdfB64.split(',')[1];
                            const binary = atob(base64Data);
                            const len = binary.length;
                            const bytes = new Uint8Array(len);
                            for (let i = 0; i < len; i++) {
                                bytes[i] = binary.charCodeAt(i);
                            }
                            const docToAppend = await PDFDocument.load(bytes);
                            const copiedPages = await pdfDoc.copyPages(docToAppend, docToAppend.getPageIndices());
                            copiedPages.forEach((page) => {
                                pdfDoc.addPage(page);
                            });
                        } catch(e) {
                            console.error("Error agregando pdf:", e);
                        }
                    }

                    // Guardar resultado final
                    const finalPdfBytes = await pdfDoc.save();
                    const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = opt.filename;
                    link.click();

                } catch (err) {
                    console.error("Falló la generación del PDF", err);
                    alert("Ocurrió un error al generar y adjuntar los archivos en el EDP.");

            const downloadTemplate = () => {

                headers.push('cantidad');

                    unitObj.params.forEach(p => headers.push(p));

                const ws = XLSX.utils.aoa_to_sheet([headers]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Plantilla");
                XLSX.writeFile(wb, `Plantilla_Cubicaciones_${actObj?.nombre || 'Actividad'}.xlsx`);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const dataArr = new Uint8Array(evt.target.result);
                    const wb = XLSX.read(dataArr, {type:'array'});
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws, {header: 1});
                    
                    if (data.length < 2) {
                        alert('El archivo está vacío o no tiene datos de cubicación.');
                        e.target.value = null;
                        return;
                    }
                    
                    const headers = data[0].map(h => String(h || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")); 
                    const newRows = [];
                    const actId = parseInt(activeActivityFilter);
                    const actObj = actividades.find(a => a.id === actId);
                    const unitId = actObj ? actObj.unidadId : '';
                    
                    // Función para normalizar nombres de columnas para comparación
                    const norm = (s) => String(s || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                    let nextId = Date.now();
                    for(let i = 1; i < data.length; i++) {
                        const rowData = data[i];
                        if (!rowData || rowData.length === 0) continue;
                        
                        const newRow = {
                            id: nextId++,
                            isFileAttached: false,
                            infoFields: {},
                            actividadId: actId || '',
                            unidadId: unitId || '',
                            mathParams: { cantidad: 1 },
                            subActivityProgress: {},
                            subActivityProgressEDP: {}
                        };
                        
                        let hasAnyData = false;
                        data[0].forEach((h, idx) => {
                            const val = rowData[idx] !== undefined ? rowData[idx] : '';
                            if (val !== '') hasAnyData = true;
                            
                            const normalizedH = norm(h);
                            
                            // Mapeo flexible
                            if (infoColumns.some(col => norm(col) === normalizedH)) {
                                // Encontrar el nombre original de la columna en infoColumns
                                const originalCol = infoColumns.find(col => norm(col) === normalizedH);
                                newRow.infoFields[originalCol] = val;
                            } else if (normalizedH === 'cantidad' || normalizedH === 'cant') {
                                newRow.mathParams.cantidad = val !== '' ? parseFloat(val) : 1;
                            } else {
                                // Buscar si coincide con algún parámetro de la unidad
                                newRow.mathParams[h] = val !== '' ? parseFloat(val) : '';
                            }
                        });
                        
                        if (hasAnyData) {
                            newRows.push(newRow);
                        }
                    }
                    
                    if (newRows.length > 0) {
                        const currentValidRows = rows.filter(r => !isEmptyRow(r));
                        const combined = [...currentValidRows, ...newRows];
                        setRows(combined);
                        alert(`✅ Se importaron ${newRows.length} filas correctamente.`);
                    } else {
                        alert('No se encontraron filas válidas para importar.');
                    }
                    e.target.value = null; 
                };
                reader.readAsArrayBuffer(file);
            };

            const [formData, setFormData] = useState({
                id: null,
                isFileAttached: false,
                infoFields: {},
                actividadId: '',
                unidadId: '',
                mathParams: { cantidad: 1, valorManual: '' },
                subActivityProgress: {},
                subActivityProgressEDP: {}
            });
            const [isEditing, setIsEditing] = useState(false);

            const handleAddColumn = () => {
                if (newColName.trim() && !infoColumns.includes(newColName.trim())) {
                    setInfoColumns([...infoColumns, newColName.trim()]);
                    
                    // Actualizar todas las filas existentes para que tengan esta columna
                    setRows(rows.map(r => ({
                        ...r, 
                        infoFields: { ...r.infoFields, [newColName.trim()]: '' }
                    })));

                    setNewColName('');
                    setShowNewColForm(false);
                }
            };

            const resetForm = () => {
                const actId = activeActivityFilter ? parseInt(activeActivityFilter) : '';
                const actObj = actividades.find(a => a.id === actId);
                const unitId = actObj ? actObj.unidadId : '';

                setFormData({
                    id: null,
                    attachments: [],
                    infoFields: {},
                    actividadId: actId,
                    unidadId: unitId,
                    mathParams: { cantidad: 1, valorManual: '' },
                    subActivityProgress: {},
                    subActivityProgressEDP: {}
                });
                setIsEditing(false);
                setItemizadoSearch('');
            };

            const handleAddSavedRow = () => {
                // Validación para evitar guardar campos vacíos
                const requiredFields = ['Item', 'Descripción', 'Ubicación', 'Elemento'];
                for (const req of requiredFields) {
                    const val = formData.infoFields[req];
                    if (val === undefined || val === null || val.toString().trim() === '') {
                        alert(`❌ El campo "${req}" no puede estar vacío.\nDebe rellenarlo con un texto antes de presionar el botón de ${isEditing ? 'Actualizar' : 'Añadir'}.`);
                        return;
                    }
                }

                if (formData.unidadId) {
                    const unit = unidades.find(u => u.id === formData.unidadId);
                    const manualVal = formData.mathParams?.valorManual;
                    const hasManual = manualVal !== '' && manualVal !== undefined && manualVal !== null;

                    if (unit && unit.params.length > 0 && !hasManual) {
                        const missingParams = unit.params.filter(p => formData.mathParams[p] === undefined || formData.mathParams[p] === '');
                        if (missingParams.length > 0) {
                            alert(`⚠️ Debe ingresar parámetros de fórmula o un Total de Medición manual.`);
                            return;
                        }
                    }
                }

                if (isEditing && formData.id) {
                    setRows(prevRows => prevRows.map(r => r.id === formData.id ? { ...formData } : r));
                } else {
                    const activeRows = rows.filter(r => {
                        const hasInfo = Object.values(r.infoFields || {}).some(v => v !== '');
                        const hasAtt = r.attachments && r.attachments.length > 0;
                        const hasSub = Object.values(r.subActivityProgress || {}).some(v => v !== '' && parseFloat(v) > 0);
                        const hasMath = Object.keys(r.mathParams || {}).filter(k => k !== 'cantidad').some(k => r.mathParams[k] !== '' && r.mathParams[k] !== undefined && r.mathParams[k] !== 0);
                        return hasInfo || hasAtt || hasSub || hasMath;
                    });
                    
                    activeRows.push({ ...formData, id: `row-${Date.now()}` });
                    
                    const actId = activeActivityFilter ? parseInt(activeActivityFilter) : '';
                    const actObj = actividades.find(a => a.id === actId);
                    const unitId = actObj ? actObj.unidadId : '';
                    setRows(activeRows);
                }
                resetForm();
            };

            const topScrollRef = React.useRef(null);
            const tableContainerRef = React.useRef(null);
            const tableScrollInnerRef = React.useRef(null);
            const [tableInnerWidth, setTableInnerWidth] = React.useState(0);

            React.useEffect(() => {
                if (!tableScrollInnerRef.current) return;
                const observer = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        setTableInnerWidth(entry.contentRect.width);
                    }
                });
                observer.observe(tableScrollInnerRef.current);
                return () => observer.disconnect();
            }, [rows, infoColumns, activeActivityFilter]);

            const handleTopScroll = (e) => {
                if (tableContainerRef.current && tableContainerRef.current.scrollLeft !== e.target.scrollLeft) {
                    tableContainerRef.current.scrollLeft = e.target.scrollLeft;
                }
            };
            
            const handleBottomScroll = (e) => {
                if (topScrollRef.current && topScrollRef.current.scrollLeft !== e.target.scrollLeft) {
                    topScrollRef.current.scrollLeft = e.target.scrollLeft;
                }
            };

            const handleEditRow = (row) => {
                setFormData({ ...row });
                setIsEditing(true);
                // Pre-llenar el combo de búsqueda con el item de la fila
                const cod = row.infoFields?.['Item'] || '';
                const desc = row.infoFields?.['Descripción'] || '';
                setItemizadoSearch(cod && desc ? `${cod} - ${desc}` : cod || desc || '');

            const handleDeleteRow = (id) => {
                setRows(prevRows => prevRows.filter(r => r.id !== id));

            const updateFormInfoField = (colName, value) => {
                setFormData(prev => ({
                    ...prev,
                    infoFields: { ...prev.infoFields, [colName]: value }
                }));

            const selectItemizadoItem = (pt) => {

                const desc = pt.Descripcion_Item || pt.descripcion || pt.Descripción_Item || '';
                setFormData(prev => ({

                }));
                setItemizadoSearch(`${codigo} - ${desc}`);
                setShowItemizadoDropdown(false);
            };

            const updateFormMathParam = (param, value) => {
                const valStr = value.toString().trim();
                const valNum = valStr === '' ? '' : (parseFloat(valStr) || 0);
                
                const unitObj = unidades.find(u => u.id == formData.unidadId);
                const isManualField = param === 'valorManual';
                let hasConflict = false;
                
                if (valNum > 0) {
                    if (isManualField) {
                        if (unitObj && unitObj.params) {
                            hasConflict = unitObj.params.some(p => (parseFloat(formData.mathParams[p]) || 0) > 0);
                        }
                    } else if (param !== 'cantidad') {
                        hasConflict = (parseFloat(formData.mathParams.valorManual) || 0) > 0;
                    }
                }
                
                if (hasConflict) {
                    alert("⚠️ No se permite completar ambos campos (Fórmula y Manual). Use solo uno para el cálculo.");
                    return;
                }

                setFormData(prev => ({
                    ...prev, 
                    mathParams: { ...prev.mathParams, [param]: valNum }
                }));
            };

            const handleFormActivityChange = (actIdStr) => {
                const actId = parseInt(actIdStr) || '';
                const actividad = actividades.find(a => a.id === actId);
                
                // Si la actividad tiene una unidad predefinida, usarla automáticamente

                setFormData(prev => ({ 
                    ...prev, 
                    actividadId: actId, 
                    unidadId: newUnitId,
                    mathParams: { cantidad: 1 } // Resetear parámetros al cambiar actividad/unidad
                }));
            };

            const handleFormUnitChange = (unitIdStr) => {
                setFormData(prev => ({ ...prev, unidadId: parseInt(unitIdStr) || '', mathParams: { cantidad: 1 } }));
            };

            const updateRow = (id, field, value) => {
                setRows(rows.map(r => r.id === id ? { ...r, [field]: value } : r));
            };

            const updateInfoField = (rowId, colName, value) => {
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                        return { ...r, infoFields: { ...r.infoFields, [colName]: value } };
                    }
                    return r;
                }));
            };

            const updateMathParam = (rowId, param, value) => {
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                        const valStr = value.toString().trim();
                        const valNum = valStr === '' ? '' : (parseFloat(valStr) || 0);
                        
                        // Validación de exclusión Manual vs Fórmula
                        const m = r.mathParams || {};
                        const unitObj = unidades.find(u => u.id == r.unidadId);
                        const isManualField = param === 'valorManual';
                        
                        let hasConflict = false;
                        if (valNum > 0) {
                            if (isManualField) {
                                if (unitObj && unitObj.params) {
                                    hasConflict = unitObj.params.some(p => (parseFloat(m[p]) || 0) > 0);
                                }
                            } else if (param !== 'cantidad') {
                                hasConflict = (parseFloat(m.valorManual) || 0) > 0;
                            }
                        }

                        if (hasConflict) {
                            alert("⚠️ No se permite completar ambos campos (Fórmula y Manual). Use solo uno para el cálculo.");
                            return r;
                        }

                        return { ...r, mathParams: { ...r.mathParams, [param]: valNum } };
                    }
                    return r;
                }));
            };

            const updateRowField = (rowId, field, value) => {
                setRows(rows.map(r => r.id === rowId ? { ...r, [field]: value } : r));
            };

            const updateSubActivityProgress = (rowId, subId, value) => {
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                        const takeoff = calculateTakeoff(r);
                        let valNum = parseFloat(value);
                        
                        // Validar límites: 0 a Total Cubicador (Takeoff)
                        if (isNaN(valNum)) valNum = '';
                        else if (valNum < 0) valNum = 0;
                        else if (valNum > takeoff && takeoff > 0) valNum = takeoff;

                        const progressKey = activeTab === 'fisico' ? 'subActivityProgress' : 'subActivityProgressEDP';
                        return { ...r, [progressKey]: { ...r[progressKey], [subId]: valNum } };
                    }
                    return r;
                }));
            };

            const updateSubActivityMapping = (rowId, subId, value) => {
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                        return { ...r, subActivityMapping: { ...(r.subActivityMapping || {}), [subId]: value } };
                    }
                    return r;
                }));
            };

            const updateSubActivityWeight = (actId, subId, newWeight) => {
                const val = parseFloat(newWeight) || 0;
                if (val < 0 || val > 100) return;
                const isEDP = activeTab === 'edp';
                const fieldKey = isEDP ? 'porcentajeEDP' : 'porcentaje';
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    return { ...act, subActividades: (act.subActividades || []).map(s =>
                        s.id === subId ? { ...s, [fieldKey]: val } : s
                    )};
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
                showSuccess(`Ponderación ${isEDP ? 'EDP' : 'Física'} actualizada.`);

            const updateSubActivityName = (actId, subId, newName) => {
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    return { ...act, subActividades: (act.subActividades || []).map(s =>
                        s.id === subId ? { ...s, nombre: newName } : s
                    )};
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
            };

            const addSubActivityDirectly = (actId) => {
                const isEDP = activeTab === 'edp';
                const newSub = { id: Date.now(), nombre: 'Nueva Sub', desc: '', porcentaje: isEDP ? 0 : 10, porcentajeEDP: isEDP ? 10 : 0 };
                const updated = actividades.map(act => {

                localStorage.setItem('app_actividades', JSON.stringify(updated));

            const deleteSubActivityDirectly = (actId, subId) => {
                askConfirm('Eliminar Sub-actividad', '¿Está seguro de eliminar esta columna? Los datos de progreso se perderán.', () => {
                    const updated = actividades.map(act => {
                        if (act.id !== actId) return act;
                        return { ...act, subActividades: (act.subActividades || []).filter(s => s.id !== subId) };
                    });
                    setActividades(updated);
                    localStorage.setItem('app_actividades', JSON.stringify(updated));
                    showSuccess('Sub-actividad eliminada.');
                });
            };

            const reorderSubActivities = (actId, fromIdx, toIdx) => {
                if (fromIdx === toIdx) return;
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    const subs = [...(act.subActividades || [])];
                    const [moved] = subs.splice(fromIdx, 1);
                    subs.splice(toIdx, 0, moved);
                    return { ...act, subActividades: subs };
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));

                const actId = parseInt(actIdStr) || '';
