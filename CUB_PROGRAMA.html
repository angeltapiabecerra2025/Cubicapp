                    if (r.id === rowId) {
                        return { ...r, actividadId: actId, subActivityProgress: {} };
                    }
                    return r;
                }));
            };

            const handleUnitChange = (rowId, unitIdStr) => {
                const unitId = parseInt(unitIdStr) || '';
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                    return { ...r, unidadId: unitId, mathParams: { cantidad: 1 } };
                    }
                    return r;
                }));
            };

            const calculateTakeoff = (row) => {
                if (!row) return 0;
                const m = row.mathParams || {};
                const cant = parseFloat(m.cantidad) >= 0 ? parseFloat(m.cantidad) : 1;
                
                // 1. Prioridad Manual (Si es mayor a 0)
                const manual = parseFloat(m.valorManual) || 0;
                
                // 2. Cálculo por parámetros/fórmula
                let formulaResult = 0;
                const unit = unidades.find(u => u.id == row.unidadId);
                if (unit && unit.params && unit.params.length > 0) {
                    let hasParamValue = false;
                    const pMap = {};
                    unit.params.forEach(p => {
                        const val = parseFloat(m[p]);
                        if (!isNaN(val) && m[p] !== '' && m[p] !== null) {
                           pMap[p] = val;
                           if (val > 0) hasParamValue = true;
                        } else {
                           pMap[p] = 0;
                        }
                    });

                    if (hasParamValue) {
                        let base = 1;
                        if (unit.formula && unit.formula.trim() !== '') {
                           try {
                               let fs = unit.formula.toLowerCase().replace(/\^/g, '**');
                               unit.params.forEach(p => {
                                   const reg = new RegExp('\\b' + p.toLowerCase().trim() + '\\b', 'g');
                                   fs = fs.replace(reg, `(${pMap[p] || 0})`);
                               });
                               base = new Function(`return ${fs}`)() || 0;
                           } catch(e) { base = 0; }
                        } else {
                           unit.params.forEach(p => { base *= (pMap[p] || 0); });
                        }
                        formulaResult = base;
                    }
                }

                let finalBase = 0;
                if (manual > 0) {
                    finalBase = manual;
                } else if (formulaResult > 0) {
                    finalBase = formulaResult;
                }

                const takeoff = (finalBase * cant) || 0;
                return Math.round(takeoff * 100) / 100;
            };

            const getWeightSetting = (actId, subId) => {
                if (!activeProject || !actId) return 0;
                const key = `${activeProject}_${actId}_${subId}`;
                const config = ponderaciones[key];
                
                // Priorizar configuración por proyecto (EDP > Planificador > Cubicador)
                if (config) {
                    const projectWeight = parseFloat(config.edp) || parseFloat(config.planificador) || parseFloat(config.cubicador);
                    if (projectWeight !== undefined && projectWeight !== 0) return projectWeight;
                }

                // Fallback: Buscar en el maestro de actividades
                const act = actividades.find(a => a.id === actId);
                const sub = act?.subActividades?.find(s => s.id === subId);
                return parseFloat(sub?.porcentaje) || 0;
            };

            const calculatePhysicalProgress = (row, act, excludeProtocolo = false) => {
                if (!act || !act.subActividades || act.subActividades.length === 0) return 0;
                const takeoff = calculateTakeoff(row);
                const fisicaData = row?.subActivityProgress || {};
                const allSubs = act.subActividades || [];
                let totalPhysical = 0;
                let weightSum = 0;

                allSubs.forEach(sub => {
                    if (!sub) return;
                    const isProt = (sub.nombre || '').toLowerCase().includes('protocolo');
                    if (excludeProtocolo && isProt) return;

                    const weight = parseFloat(sub.porcentaje) || 0;
                    if (weight <= 0) return;
                    
                    const qty = parseFloat(fisicaData[sub.id]) || 0;
                    totalPhysical += qty * weight / 100;
                    weightSum += weight;
                });
                
                if (excludeProtocolo) {
                    if (weightSum <= 0 || takeoff <= 0) return 0;
                    const expected = (weightSum / 100) * takeoff;
                    if (expected <= 0) return 0;
                    return (totalPhysical / expected) * 100;
                }
                return totalPhysical;
            };

            const calculateExecutedQty = (row, act, mode = 'parcial') => {
                if (!act || !act.subActividades || act.subActividades.length === 0) return 0;

                const isEDP = activeTab === 'edp';
                const fisicaData = row.subActivityProgress || {};
                const edpData = row.subActivityProgressEDP || {};
                const allSubs = act.subActividades;
                let totalExecuted = 0;

                const takeoff = calculateTakeoff(row);

                if (isEDP) {
                    const physicalP = takeoff > 0 ? (calculatePhysicalProgress(row, act) / takeoff * 100) : 0;
                    
                    // EDP: agrupar por el campo 'grupoEDP' (o 'nombre' si está vacío)
                    const groupsMap = {};
                    allSubs.forEach(s => {
                        const gName = (s.grupoEDP || s.nombre || '').trim();
                        if (!groupsMap[gName]) groupsMap[gName] = { name: gName, weight: 0, subs: [] };
                        groupsMap[gName].weight += (parseFloat(s.porcentajeEDP) || 0);
                        groupsMap[gName].subs.push(s);
                    });

                    Object.values(groupsMap).forEach(g => {
                        if (g.weight <= 0) return;
                        
                        const isProtocolo = (g.name || '').toLowerCase().includes('protocolo');
                        
                        if (isProtocolo) {
                            // Lógica Protocolo: Solo si físico base (no protocolo) == 100%
                            const physicalBaseP = calculatePhysicalProgress(row, act, true);
                            if (physicalBaseP >= 99.9) { 
                                const subId = g.subs && g.subs[0] ? g.subs[0].id : null;
                                const manualVal = subId ? (parseFloat(edpData[subId]) || 0) : 0;
                                totalExecuted += manualVal * g.weight / 100;
                            }
                        } else {
                            // Lógica estricta: El avance EDP solo cuenta si TODAS las sub-actividades físicas del grupo tienen avance
                            const fyzVals = g.subs.map(s => parseFloat(fisicaData[s.id]) || 0);
                            const allHaveProgress = fyzVals.length > 0 && fyzVals.every(v => v > 0);
                            
                            if (allHaveProgress) {
                                const avg = fyzVals.reduce((a, b) => a + b, 0) / fyzVals.length;
                                totalExecuted += avg * g.weight / 100;
                            }
                        }
                    });
                } else {
                    // FÍSICO
                    if (mode === 'real') {
                        const subsReal = allSubs.filter(s => !(s.nombre || '').toLowerCase().includes('protocolo'));
                        if (subsReal.length === 0) return 0;

                        const sumVal = subsReal.reduce((acc, s) => acc + (parseFloat(fisicaData[s.id]) || 0), 0);
                        totalExecuted = sumVal / subsReal.length;
                    } else {
                        totalExecuted = calculatePhysicalProgress(row, act);
                    }
                }

                return Math.round(totalExecuted * 100) / 100;
            };


            const renderSubActivities = (row, act, maxSubs) => {
                if (!act || !act.subActividades || act.subActividades.length === 0)
                    return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                const isEDP = activeTab === 'edp';
                const allSubs = act.subActividades;
                const fisicaData = row.subActivityProgress || {};

                if (isEDP) {
                    // ---- MODO EDP ----
                    // Agrupar por grupoEDP
                    const groupsList = [];
                    allSubs.forEach(s => {
                        const gName = (s.grupoEDP || s.nombre || '').trim();
                        let g = groupsList.find(x => x.name === gName);
                        if (!g) {
                            g = { name: gName, weight: 0, subs: [] };
                            groupsList.push(g);
                        }
                        g.weight += (parseFloat(s.porcentajeEDP) || 0);
                        g.subs.push(s);
                    });

                    const activeGroups = groupsList.filter(g => g.weight > 0);
                    if (activeGroups.length === 0)
                        return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                    const takeoff = calculateTakeoff(row);
                    const physicalP = takeoff > 0 ? (calculatePhysicalProgress(row, act) / takeoff * 100) : 0;
                    const edpData = row.subActivityProgressEDP || {};

                    return (
                        <td class="p-0 border border-slate-200 bg-amber-50/10" colSpan={maxSubs}>
                            <div class="flex h-full min-h-[48px]">
                                {activeGroups.map((g, idx) => {
                                    const isProtocolo = (g.name || '').toLowerCase().includes('protocolo');
                                    const firstSubId = g.subs && g.subs[0] ? g.subs[0].id : null;

                                    if (isProtocolo) {
                                        const physicalBaseP = calculatePhysicalProgress(row, act, true);
                                        const isEnabled = physicalBaseP >= 99.9; 
                                        return (
                                            <div key={g.name || idx} class={`flex-1 min-w-[110px] p-1 flex flex-col items-center justify-center gap-0.5 ${idx < activeGroups.length - 1 ? 'border-r border-amber-100' : ''} ${isEnabled ? 'bg-emerald-50' : 'bg-slate-100 opacity-60'}`}>
                                                {!isEnabled && <span class="text-[8px] font-bold text-slate-400 uppercase">Bloq. &lt; 100% Fís.</span>}
                                                <input
                                                    type="number"
                                                    disabled={!isEnabled}
                                                    class={`w-full text-center border-none bg-transparent rounded p-1 text-[13px] outline-none ${isEnabled ? 'focus:ring-1 focus:ring-emerald-400 font-black text-emerald-900' : 'text-slate-400 font-bold'}`}
                                                    placeholder={isEnabled ? "0.00" : "-"}
                                                    value={(isEnabled && firstSubId) ? (edpData[firstSubId] || '') : ''}
                                                    onChange={e => firstSubId && updateSubActivityProgress(row.id, firstSubId, e.target.value)}
                                                />
                                            </div>
                                        );
                                    }

                                    const fisicaVals = g.subs.map(s => parseFloat(fisicaData[s.id]) || 0);
                                    const allHaveProgress = fisicaVals.length > 0 && fisicaVals.every(v => v > 0);
                                    const avg = (allHaveProgress && fisicaVals.length > 0) ? (fisicaVals.reduce((a, b) => a + b, 0) / fisicaVals.length) : 0;
                                    
                                    return (
                                        <div key={g.name || idx} class={`flex-1 min-w-[110px] p-1 flex flex-col items-center justify-center gap-0.5 ${idx < activeGroups.length - 1 ? 'border-r border-amber-100' : ''} bg-amber-50/20`}>
                                            <span class="text-[14px] font-black text-amber-900">
                                                {(allHaveProgress && !isNaN(avg)) ? avg.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </td>
                    );
                } else {
                    // ---- MODO FÍSICO ----
                    const filteredSubs = allSubs.filter(s => (parseFloat(s.porcentaje) || 0) > 0);
                    if (filteredSubs.length === 0)
                        return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                    const allGanttTasks = programasPorProyecto[activeProject] || [];
                    const availableSubTasks = allGanttTasks.filter(t => t.taskId === row.programaTask && t.subId);
                    const mappingData = row.subActivityMapping || {};

                    return (
                        <td class="p-0 border border-slate-200 bg-slate-50/20" colSpan={maxSubs}>
                            <div class="flex h-full min-h-[40px]">
                                {filteredSubs.map((sub, idx) => {
                                    const listId = `list-gantt-sub-${row.id}-${sub.id}`;
                                    const displayVal = mappingData[sub.id] || '';
                                    return (
                                        <div key={sub.id} class={`flex-1 min-w-[120px] p-1 flex items-center justify-center ${idx !== filteredSubs.length - 1 ? 'border-r border-slate-100' : ''}`}>
                                            <input
                                                list={listId}
                                                class="w-full text-center border-none bg-white rounded p-1 text-[9px] outline-none focus:ring-1 focus:ring-blue-400 font-bold text-slate-700 transition-all h-8 shadow-sm"
                                                placeholder={`Buscar ${sub.nombre}...`}
                                                value={displayVal}
                                                onChange={e => updateSubActivityMapping(row.id, sub.id, e.target.value)}
                                                title={`Mapear avance de ${sub.nombre} a tarea Gantt`}
                                            />
                                            <datalist id={listId}>
                                                {availableSubTasks.map(gt => (
                                                    <option key={gt.id} value={`${gt.subId} - ${gt.desc}`} />
                                                ))}
                                            </datalist>
                                        </div>
                                    );
                                })}
                            </div>
                        </td>
                    );
                }
            };

            let maxSubActivities = 1;
            const isEDP_view = activeTab === 'edp';
            rows.forEach(r => {
                if (r.actividadId) {
                    const act = actividades.find(a => a.id === r.actividadId);
                    if (act && act.subActividades) {
                        const filtered = (act.subActividades || []).filter(sub => {
                            const weight = isEDP_view ? (parseFloat(sub.porcentajeEDP) || 0) : (parseFloat(sub.porcentaje) || 0);
                            return weight > 0;
                        });
                        if (filtered.length > maxSubActivities) {
                            maxSubActivities = filtered.length;
                        }
                    }
                }
            });
            
            // El botón de agregar ya no está en la tabla → effectiveMaxSubs = maxSubActivities alone
            const effectiveMaxSubs = maxSubActivities;

            let maxMathParams = 2;
            rows.forEach(r => {
                if (r.unidadId) {
                    const u = unidades.find(un => un.id === r.unidadId);
                    if (u && u.params && u.params.length > maxMathParams) {
                        maxMathParams = u.params.length;
                    }
                }
            });

            const getColWidth = (col) => {
                const c = col.toLowerCase();
                if (c === 'item') return 70;
                if (c === 'descripción' || c === 'descripcion' || c === 'desc') return 350;
                if (c === 'ubicación' || c === 'ubicacion') return 200;
                if (c === 'elemento') return 150;
                return 120;
            };

            return (
                <div class="space-y-4">
                    {/* Header & Settings */}
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <span class="text-3xl">📊</span>
                                <div>
                                    <h2 class="font-extrabold text-slate-800 text-xl">Planilla de Cubicaciones</h2>
                                    <p class="text-xs text-slate-500">Avance y cálculo dinámico (Ponderaciones heredadas del proyecto)</p>
                                </div>
                            </div>

                            <div class="flex flex-col gap-3 border-t md:border-t-0 border-slate-100 pt-4 md:pt-0">
                                {/* Row 1: Filters + Add Column */}
                                <div class="flex flex-col sm:flex-row items-center gap-3">
                                    <div class="w-full sm:w-56">
                                        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Proyecto Activo</label>
                                        <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-blue-50 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-800 cursor-pointer shadow-sm" value={activeProject} onChange={e => {
                                            setActiveProject(e.target.value);
                                            setActiveEspecialidadFilter('');
                                            setActiveActivityFilter('');
                                        }}>
                                            <option value="">-- Seleccionar Obra --</option>
                                            {proyectos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                                        </select>
                                    </div>
                                    {activeProject && (
                                        <div class="w-full sm:w-52 animate-in fade-in zoom-in duration-300">
                                            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Especialidad</label>
                                            <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600 cursor-pointer shadow-sm"
                                                    value={activeEspecialidadFilter} 
                                                    onChange={e => {
                                                        setActiveEspecialidadFilter(e.target.value);
                                                        setActiveActivityFilter(''); 
                                                    }}>
                                                <option value="">-- Todas las Especialidades --</option>
                                                {especialidades && especialidades.map(esp => (
                                                    <option key={esp.id} value={esp.id}>{esp.nombre}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    {activeProject && (
                                        <div class="w-full sm:w-52 animate-in fade-in zoom-in duration-300">
                                            <label class="block text-[9px] font-bold text-amber-500 uppercase tracking-widest mb-1.5 ml-1">Actividad a Cubicar</label>
                                            <select class="w-full border border-amber-200 rounded-lg p-2.5 text-sm bg-amber-50 focus:ring-2 focus:ring-amber-500 outline-none font-bold text-amber-800 cursor-pointer shadow-sm" value={activeActivityFilter} onChange={e => setActiveActivityFilter(e.target.value)}>
                                                <option value="">-- Seleccionar Actividad --</option>
                                                {proyectos.find(p => p.id === parseInt(activeProject))?.actividades.map(actId => {
                                                    const act = actividades.find(a => a.id === actId);
                                                    if (!act) return null;
                                                    if (activeEspecialidadFilter && act.especialidadId != activeEspecialidadFilter) return null;
                                                    return <option key={actId} value={actId}>{act.nombre}</option>;
                                                })}
                                            </select>
                                        </div>
                                    )}
                                </div>
                                {/* Row 2: Action buttons — only when project+activity selected */}
                                {activeProject && activeActivityFilter && (
                                    <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 animate-in fade-in slide-in-from-top-2 duration-300">
                                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mr-1">Acciones:</span>
                                        <button class="bg-green-700 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-green-800 flex items-center gap-1.5 transition-colors shadow-md" onClick={exportToExcel}>
                                            <span>📊</span> Exportar Excel
                                        </button>
                                        <button class="bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-emerald-800 transition-all flex items-center gap-1.5 shadow-sm whitespace-nowrap" onClick={handleSaveGeneral}>
                                            💾 Guardar Cambios (Mapeo)
                                        </button>
                                        {activeTab === 'edp' && (
                                            <button id="btn-export-pdf" class="bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-red-700 flex items-center gap-1.5 transition-colors shadow-md" onClick={exportToPDF}>
                                                <span>📄</span> Exportar EDP
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {activeProject && !activeActivityFilter && (
                        <div class="bg-amber-50 border-2 border-dashed border-amber-200 rounded-2xl p-12 text-center shadow-inner mt-4 animate-in fade-in zoom-in duration-300">
                            <div class="text-amber-300 text-6xl mb-4">📋</div>
                            <h3 class="text-xl font-extrabold text-amber-800">Seleccione una Actividad</h3>
                            <p class="text-amber-600/70 mt-2 text-sm">Seleccione una actividad en el menú superior para comenzar a ingresar o visualizar cubicaciones.</p>
                        </div>
                    )}

                    {activeProject && activeActivityFilter && (
                        <div class="bg-white p-5 rounded-xl shadow-lg border border-slate-200 animate-in fade-in slide-in-from-top-4 duration-500" id="tabla-cubicaciones-container">
                            
                            {/* Tabs Estilo Excel */}
                            <div class="flex border-b border-slate-200 mb-6 bg-slate-50 rounded-t-xl overflow-hidden">
                                <button 
                                    class={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-all flex items-center gap-2 border-r border-slate-200 ${activeTab === 'fisico' ? 'bg-white text-blue-600 border-b-2 border-b-blue-500 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}
                                    onClick={() => setActiveTab('fisico')}
                                >
                                    <span class="text-base">🏗️</span> Avance Físico
                                </button>
                                <div class="flex-1 bg-slate-50 border-b border-slate-200"></div>
                            </div>
                            {/* Formulario de ingreso - solo visible en Avance Físico */}
                            <div style={{display: activeTab === 'fisico' ? 'block' : 'none'}}>
                                <div class="flex items-center gap-2 ml-2">
                                    <span class="text-slate-400 text-[10px] italic">Seleccione unidad para calcular</span>
                                </div>
                            </div>{/* cierra div formulario con display condicional */}

                        </div>
                    )}

                    {!activeProject ? (
                        <div class="bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl p-12 text-center shadow-inner">
                            <div class="text-blue-300 text-6xl mb-4">🏗️</div>
                            <h3 class="text-xl font-extrabold text-blue-800">Seleccione un Proyecto</h3>
                            <p class="text-blue-600/70 mt-2 text-sm">Para cargar las ponderaciones automáticas y comenzar a cubicar, seleccione la obra en el menú superior.</p>
                        </div>
                    ) : (
                        <div class="bg-white rounded-xl border border-slate-300 shadow-xl overflow-hidden relative flex flex-col" style={{ height: 'calc(100vh - 280px)' }}>
                            {tableInnerWidth > 0 && (
                                <div ref={topScrollRef} onScroll={handleTopScroll} class="overflow-x-auto overflow-y-hidden border-b border-slate-200 scrollbar-thin scrollbar-thumb-slate-400 bg-slate-50 flex-none" style={{ minHeight: '14px' }}>
                                    <div style={{ width: `${tableInnerWidth}px`, height: '1px' }}></div>
                                </div>
                            )}
                            <div ref={tableContainerRef} onScroll={handleBottomScroll} class="overflow-auto flex-1 relative scrollbar-thin scrollbar-thumb-slate-300 scrollbar-track-slate-50">
                                <table ref={tableScrollInnerRef} id="tabla-cubicaciones-main-print" class="w-full text-left table-fixed min-w-max border-collapse border border-slate-300">
                                    <thead class="bg-slate-700 text-white sticky top-0 z-20 shadow-lg border-b-2 border-slate-800">
                                        <tr class="text-[10px] uppercase font-black text-center divide-x divide-slate-600">
                                            <th class="p-2 w-12 bg-slate-800 text-[9px]" rowSpan={2}>#</th>
                                            <th class="p-2 w-24 bg-slate-800 text-[9px] hide-on-pdf" rowSpan={2}>Acciones</th>
                                            <th class="p-2 w-10 bg-slate-800 text-[9px] hide-on-pdf" rowSpan={2}>📎</th>
                                            
                                            {infoColumns.map((col, idx) => {
                                                const cw = getColWidth(col);
                                                return (
                                                <th 
                                                    key={col} 
                                                    class="p-2 group relative bg-slate-700/50 text-[9px] cursor-move hover:bg-slate-600 transition-colors"
                                                    style={{ width: `${cw}px`, minWidth: `${cw}px` }}
                                                    rowSpan={2}
                                                    draggable="true"
                                                    onDragStart={(e) => {
                                                        e.dataTransfer.setData('colIndex', idx.toString());
                                                        e.dataTransfer.effectAllowed = 'move';
                                                    }}
                                                    onDragOver={(e) => {
                                                        e.preventDefault();
                                                        e.dataTransfer.dropEffect = 'move';
                                                    }}
                                                    onDrop={(e) => {
                                                        e.preventDefault();
                                                        const fromIdx = parseInt(e.dataTransfer.getData('colIndex'));
                                                        const toIdx = idx;
                                                        if (fromIdx !== toIdx && !isNaN(fromIdx)) {
                                                            const newCols = [...infoColumns];
                                                            const [moved] = newCols.splice(fromIdx, 1);
                                                            newCols.splice(toIdx, 0, moved);
                                                            setInfoColumns(newCols);
                                                        }
                                                    }}
                                                >
                                                    <div class="flex items-center justify-between gap-2 px-1">
                                                        <span>{col}</span>
                                                        {!['Item', 'Descripción', 'Elemento', 'Ubicación'].includes(col) && (
                                                            <button class="hover:text-white hover:bg-red-500 text-slate-400 p-0.5 rounded shadow-sm opacity-50 hover:opacity-100 transition-all cursor-pointer" 
                                                                    title="Eliminar Columna" 
                                                                    onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                                                    onClick={(e) => { e.stopPropagation(); removeColumn(col); }}>
                                                                ✕
                                                            </button>
                                                        )}
                                                    </div>
                                                </th>
                                                );

                                                onClick={() => setUploadModal({ ...uploadModal, activeFilter: t })}
                                            >
                                                {t === 'Todos' ? '📂 Todos' : t === 'Plano' ? '📐 Plano' : t === 'Protocolo' ? '📝 Prot.' : t === 'Fotografía' ? '📸 Foto' : '📄 Otros'}
                                            </button>
                                        ))}
                                    </div>

                                    {/* LISTA DE ADJUNTOS ACTUALES (FILTRADA) */}
                                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                                            {uploadModal.activeFilter === 'Todos' ? 'Historial de Versiones' : `Filtrado por: ${uploadModal.activeFilter}`}
                                        </label>
                                        <div class="space-y-1.5 overflow-y-auto max-h-48 pr-1">
                                            {filteredAttachments.length > 0 ? filteredAttachments.map((att, i) => (
                                                <div key={i} class="bg-white border text-left border-slate-200 text-[10px] font-bold text-slate-700 px-2 py-2 rounded flex items-center justify-between shadow-sm hover:border-indigo-300 transition-colors">
                                                    <div class="flex-1 min-w-0 pr-2 cursor-pointer group" onClick={() => handleDownloadAttachment(att)}>
                                                        <div class="flex items-center gap-2 mb-0.5">
                                                            <span class="text-xs">{att.type === 'Plano' ? '📐' : att.type === 'Protocolo' ? '📝' : att.type === 'Fotografía' ? '📸' : '📄'}</span>
                                                            <span class="text-[8px] text-slate-400 uppercase tracking-tight">{att.date || 'Sin fecha'}</span>
                                                            {i === 0 && uploadModal.activeFilter === att.type && <span class="bg-emerald-100 text-emerald-700 text-[7px] px-1 rounded uppercase font-black">Último</span>}
                                                        </div>
                                                        <span class="text-indigo-700 truncate block w-full group-hover:underline leading-tight" title={att.name}>{att.name}</span>
                                                    </div>
                                                    <button class="text-slate-300 hover:text-red-500 focus:outline-none transition-colors p-1" title="Eliminar documento" onClick={(e) => {
                                                        e.preventDefault();
                                                        setRows(prevRows => {
                                                            const newRows = prevRows.map(ro => ro.id === uploadModal.rowId ? {...ro, attachments: ro.attachments.filter(a => a !== att)} : ro);
                                                            const key = `cubprograma_data_${activeProject}_${activeActivityFilter}`;
                                                            localStorage.setItem(key, JSON.stringify(newRows));
                                                            return newRows;
                                                        });
                                                    }}>✕</button>
                                                </div>
                                            )) : (
                                                <p class="text-[10px] text-slate-400 italic text-center py-4">No hay documentos en esta categoría.</p>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* SECCIÓN SUBIR NUEVO */}
                                    <div class="border-t border-slate-100 pt-4">
                                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Categoría a Subir</label>
                                        <div class="grid grid-cols-2 gap-2 mb-3">
                                            {docTypes.filter(t => t !== 'Todos').map(type => (
                                                <button 
                                                    key={type}
                                                    class={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 transition-all ${uploadModal.type === type ? 'bg-indigo-50 border-indigo-600 ring-1 ring-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                                                    onClick={() => setUploadModal({ ...uploadModal, type: type })}
                                                >
                                                    <span class="text-xl">{type === 'Plano' ? '📐' : type === 'Protocolo' ? '📝' : type === 'Fotografía' ? '📸' : '📄'}</span>
                                                    <span class={`text-[8px] font-bold uppercase ${uploadModal.type === type ? 'text-indigo-600' : 'text-slate-400'}`}>{type.split(' ')[0]}</span>
                                                </button>
                                            ))}
                                        </div>
                                        
                                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Archivo (PDF / Imagen)</label>
                                        <label class="relative block w-full border-2 border-dashed border-indigo-200 rounded-lg p-3 text-center hover:bg-indigo-50 transition-colors cursor-pointer group">
                                            <input type="file" accept=".pdf,image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" 
                                                onChange={e => {
                                                    if (e.target.files && e.target.files.length > 0) {
                                                        setUploadModal({ ...uploadModal, file: e.target.files[0] });
                                                    }
                                                }} 
                                            />
                                            <div class="relative z-0">
                                                <span class="text-xl mb-1 block group-hover:scale-110 transition-transform">📂</span>
                                                <span class="text-[10px] font-bold break-words px-2 text-indigo-600 truncate block" title={uploadModal.file ? uploadModal.file.name : ''}>{uploadModal.file ? uploadModal.file.name : 'Seleccionar Documento'}</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                                <div class="bg-slate-50 p-4 border-t border-slate-100 flex gap-3">
                                    <button class="flex-1 py-2 rounded-lg font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-colors" onClick={() => setUploadModal({ ...uploadModal, show: false })}>Cerrar</button>
                                    <button class="flex-1 py-2 rounded-lg font-bold text-xs bg-indigo-600 text-white shadow-md shadow-indigo-600/20 hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2" onClick={handleAddAttachment}>
                                        <span class="text-lg">+</span> Subir Nueva Versión
                                    </button>
                                </div>
                            </div>
                        </div>
                        );
                    })()}
                </div>
            );
        };


        const App = () => {
            const [proyectos] = useLocalStorageState('app_proyectos', []);
            const [actividades, setActividades] = useLocalStorageState('app_actividades', []);
            const [unidades] = useLocalStorageState('app_unidades', []);
            const [especialidades] = useLocalStorageState('app_especialidades', []);
            const [itemizadosPorProyecto] = useLocalStorageState('app_itemizados', {});
            const [programasPorProyecto] = useLocalStorageState('app_programas_obra', {});
            const [ponderaciones, setPonderaciones] = useState({});

            const [successMsg, setSuccessMsg] = React.useState('');
            const [confirm, setConfirm] = React.useState({ show: false, title: '', msg: '', action: null });

            const showSuccess = (msg) => {
                setSuccessMsg(msg);
                setTimeout(() => setSuccessMsg(''), 3000);
            };

            const askConfirm = (title, msg, action) => {
                setConfirm({ show: true, title, msg, action });
            };

            return (
                <div class="min-h-screen bg-gray-50">
                    {successMsg && (
                        <div class="fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-xl text-sm font-bold animate-in slide-in-from-right duration-300 flex items-center gap-2">
                            <span>✅</span> {successMsg}
                        </div>
                    )}
                    {confirm.show && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center">
                                <div class="text-amber-500 text-4xl mb-4">⚠️</div>
                                <h4 class="text-xl font-extrabold text-slate-800 mb-2">{confirm.title}</h4>
                                <p class="text-slate-500 text-sm mb-8">{confirm.msg}</p>
                                <div class="flex gap-3 justify-center">
                                    <button class="px-6 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100" onClick={() => setConfirm({ ...confirm, show: false })}>Cancelar</button>
                                    <button class="px-6 py-2.5 rounded-xl text-sm font-bold bg-blue-600 text-white hover:bg-blue-700" onClick={() => { confirm.action(); setConfirm({ ...confirm, show: false }); }}>Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <CubProgramaPage
                        actividades={actividades}
                        setActividades={setActividades}
                        unidades={unidades}
                        proyectos={proyectos}
                        ponderaciones={ponderaciones}
                        especialidades={especialidades}
                        itemizadosPorProyecto={itemizadosPorProyecto}
                        programasPorProyecto={programasPorProyecto}
                        showSuccess={showSuccess}
                        askConfirm={askConfirm}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
