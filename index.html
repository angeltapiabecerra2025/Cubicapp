        // ============================================================
        //  COMPONENTE: PartidasPage - Carga Masiva de Itemizado
        // ============================================================
        const PartidasPage = ({ proyectos, askConfirm, showSuccess, onVolver, updateItemizadosGlobal, itemizadosPorProyecto, actividades, unidades, isObra = false, isEstadoPago = false }) => {
            const { useState, useRef, useEffect } = React;
            const [obraSeleccionada, setObraSeleccionada] = useState(null);
            const [itemizado, setItemizado] = useState([]);
            const [nombreArchivo, setNombreArchivo] = useState('');
            const [fase, setFase] = useState('seleccion'); // 'seleccion' | 'carga' | 'preview' | 'saved'
            const [errores, setErrores] = useState([]);
            const [editRowId, setEditRowId] = useState(null);
            const fileInputRef = useRef(null);
            const topScrollRef = useRef(null);
            const tableScrollRef = useRef(null);

            const handleTopScroll = () => {
                if (tableScrollRef.current && topScrollRef.current) {
                    tableScrollRef.current.scrollLeft = topScrollRef.current.scrollLeft;
                }
            };

            const handleTableScroll = () => {
                if (tableScrollRef.current && topScrollRef.current) {
                    topScrollRef.current.scrollLeft = tableScrollRef.current.scrollLeft;
                }
            };
            const [avancesPorItem, setAvancesPorItem] = useState({});

            // Helpers locales para cálculo de avance
            const calculateTakeoffInternal = (row) => {
                if (!row.unidadId) return 0;
                const unit = unidades.find(u => u.id === row.unidadId);
                if (!unit) return 0;

                const valorManual = row.mathParams?.valorManual;
                if (valorManual !== '' && valorManual !== null && valorManual !== undefined) {
                    const valMan = parseFloat(valorManual) || 0;
                    const cant = row.mathParams.cantidad !== undefined && row.mathParams.cantidad !== '' ? row.mathParams.cantidad : 1;
                    return Math.round(valMan * cant * 100) / 100;
                }

                let hasValidInput = false;
                const paramsMap = {};
                unit.params.forEach(p => {
                    const val = row.mathParams?.[p];
                    if (val !== undefined && val !== '') {
                        paramsMap[p] = parseFloat(val);
                        hasValidInput = true;
                    } else {
                        paramsMap[p] = 0;
                    }
                });

                if (!hasValidInput && unit.params.length > 0) return 0;

                let result = 1;
                if (unit.formula && unit.formula.trim() !== '') {
                    try {
                        let formulaStr = unit.formula.toLowerCase().replace(/\^/g, '**');
                        const sortedParams = [...unit.params].sort((a,b) => b.length - a.length);
                        sortedParams.forEach(p => {
                            const escChar = p.toLowerCase().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                            const regex = new RegExp('\\b' + escChar + '\\b', 'g');
                            formulaStr = formulaStr.replace(regex, `(${paramsMap[p]})`);
                        });
                        const calcFn = new Function(`return ${formulaStr};`);
                        result = calcFn();
                    } catch (e) { result = 0; }
                } else {
                    unit.params.forEach(p => { result *= paramsMap[p]; });
                }
                const cantidad = row.mathParams?.cantidad !== undefined && row.mathParams?.cantidad !== '' ? row.mathParams.cantidad : 1;
                const takeoff = (result * cantidad) || 0;
                return Math.round(takeoff * 100) / 100;
            };

            const calculateExecutedInternal = (row, actId) => {
                const act = actividades.find(a => String(a.id) === String(actId));
                if (!act || !act.subActividades || act.subActividades.length === 0) return 0;
                const takeoff = calculateTakeoffInternal(row);
                const progressData = row.subActivityProgress || {};
                let totalPct = 0;
                act.subActividades.forEach(s => {
                    const weight = parseFloat(s.porcentaje) || 0;
                    const pctDone = parseFloat(progressData[s.id]) || 0;
                    totalPct += (weight * pctDone) / 100;
                });
                return (takeoff * totalPct) / 100;
            };

            useEffect(() => {
                if (isObra && obraSeleccionada) {
                    const prefix = `cubicaciones_data_${obraSeleccionada.id}_`;
                    const map = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        // Estructura de clave: cubicaciones_data_{ProjectID}_{ActivityID}
                        const parts = (key || '').split('_');
                        
                        if (parts.length >= 4 && parts[0] === 'cubicaciones' && parts[1] === 'data' && parts[2] === String(obraSeleccionada.id)) {
                            const actId = parts.slice(3).join('_'); // Soporta IDs de actividad con guiones bajos

                            try {
                                const data = JSON.parse(localStorage.getItem(key));
                                if (Array.isArray(data)) {
                                    data.forEach(r => {
                                        const keys = Object.keys(r.infoFields || {});
                                        const itemCandidates = ['item', 'programa', 'itemizado', 'it', 'codigo', 'código'];
                                        const itemKey = keys.find(k => {
                                            const nk = k.toLowerCase().trim();
                                            return itemCandidates.some(c => nk.includes(c));
                                        });
                                        const itIdRaw = itemKey ? r.infoFields[itemKey] : '';
                                        
                                        const itId = String(itIdRaw || '').trim();
                                        if (itId) {
                                            const val = calculateExecutedInternal(r, actId);
                                            const normKey = getNorm(itId);
                                            map[normKey] = (map[normKey] || 0) + val;
                                        }
                                    });
                                }
                            } catch(e) {}
                        }
                    }
                    // Redondear todos los acumulados a 2 decimales para evitar residuos de flotantes
                    Object.keys(map).forEach(k => {
                        map[k] = Math.round(map[k] * 100) / 100;
                    });
                    setAvancesPorItem(map);
                } else {
                    setAvancesPorItem({});
                }
            }, [obraSeleccionada, itemizado, actividades, unidades]);

            const COLUMNAS = [
                'Item', 'Descripcion_Item', 'Concepto', 'Responsable',
                'Unidad_Medida', 'Cantidad', 'HH_Total',
                'Precio_Unitario', 'Rendimiento', 'Precio_Total'
            ];

            const downloadPlantilla = () => {
                const filas = [
                    COLUMNAS,
                    ['1', 'Movimiento de tierras', 'Excavación mecanizada', 'Operador', 'm3', 150, 240, 38500, 0.625, 5775000],
                    ['2', 'Hormigón emplantillado', 'Fundación corrida H20', 'Maestro', 'm3', 45, 540, 95000, 0.333, 4275000],
                    ['3', 'Enfierradura', 'Armadura D10 fundaciones', 'Enfierrador', 'kg', 2800, 1120, 1850, 2.5, 5180000],
                ];
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(filas);
                // Ancho de columnas
                ws['!cols'] = [4, 28, 28, 18, 10, 10, 10, 14, 12, 14].map(w => ({ wch: w }));
                XLSX.utils.book_append_sheet(wb, ws, 'Itemizado');
                XLSX.writeFile(wb, 'plantilla_itemizado_obra.xlsx');
            };

            const calculateHierarchyTotals = (items) => {
                if (!items || items.length === 0) return [];
                
                // Función para ordenamiento natural (1.2 < 1.10)
                const naturalSort = (a, b) => {
                    const partsA = String(a.Item).split('.').map(p => parseInt(p) || 0);
                    const partsB = String(b.Item).split('.').map(p => parseInt(p) || 0);
                    for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
                        const valA = partsA[i] || 0;
                        const valB = partsB[i] || 0;
                        if (valA !== valB) return valA - valB;
                    }
                    return 0;
                };

                const sortedItems = [...items].sort(naturalSort);
                
                // Normalizar: "2.0" -> "2", "2.1" -> "2.1"
                const getNorm = (s) => String(s || '').trim().replace(/\.0$/, '');
                
                // Obtener todos los ítems únicos normalizados
                const allNorms = [...new Set(sortedItems.map(it => getNorm(it.Item)))];
                
                // Mapear cada norma a sus filas originales
                const rowsByNorm = {};
                sortedItems.forEach(it => {
                    const norm = getNorm(it.Item);
                    if (!rowsByNorm[norm]) rowsByNorm[norm] = [];
                    rowsByNorm[norm].push(it);
                });

                const memoPrice = {};
                const memoHH = {};
                const memoAva = {};
                const memoEpaValAct = {};
                const memoEpaValAnt = {};
                const memoEpaValPres = {};

                const getSumsRecursive = (norm) => {
                    if (memoPrice[norm] !== undefined) return { 
                        price: memoPrice[norm], hh: memoHH[norm], ava: memoAva[norm],
                        epaValAct: memoEpaValAct[norm], epaValAnt: memoEpaValAnt[norm], epaValPres: memoEpaValPres[norm]
                    };

                    const prefix = norm + '.';
                    const directChildren = allNorms.filter(n => {
                        if (n.startsWith(prefix) && n !== norm) {
                            const partAfter = n.slice(prefix.length);
                            return !partAfter.includes('.');
                        }
                        return false;
                    });

                    const clean = (v) => {
                        if (typeof v === 'number') return v;
                        let s = String(v || '').trim();
                        if (!s) return 0;
                        // Eliminar símbolos de moneda y espacios
                        s = s.replace(/[$]/g, '').replace(/\s/g, '');
                        // Si viene con formato 1.234,56 -> 1234.56
                        if (s.includes('.') && s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
                        // Si viene con formato 1234,56 -> 1234.56
                        if (s.includes(',') && !s.includes('.')) return parseFloat(s.replace(',', '.')) || 0;
                        // Si tiene solo puntos y parece ser miles (ej: 45.638.752)
                        if (s.includes('.') && s.split('.').length > 2) return parseFloat(s.replace(/\./g, '')) || 0;
                        // Si tiene un punto y 3 decimales al final, sospechar miles en Chile (ej: 51.958)
                        if (s.includes('.') && s.split('.')[1].length === 3 && !s.includes(',')) {
                             // Pero solo si el número es grande. Es ambiguo, pero por ahora parseFloat estándar
                             return parseFloat(s) || 0;
                        }
                        return parseFloat(s) || 0;
                    };

                    let tPrice = 0;
                    let tHH = 0;
                    let tAva = 0;
                    let tEpaAct = 0;
                    let tEpaAnt = 0;
                    let tEpaPres = 0;

                    if (directChildren.length > 0) {
                        directChildren.forEach(cn => {
                            const res = getSumsRecursive(cn);
                            tPrice += res.price;
                            tHH += res.hh;
                            tAva += res.ava;
                            tEpaAct += res.epaValAct;
                            tEpaAnt += res.epaValAnt;
                            tEpaPres += res.epaValPres;
                        });
                    } else {
                        rowsByNorm[norm].forEach(row => {
                            const c = clean(row.Cantidad);
                            const p = clean(row.Precio_Unitario);
                            const hh = clean(row.HH_Total);
                            tPrice += (c * p);
                            tHH += hh;
                            tEpaAct += (parseFloat(row['_EPA_ValorActual']) || 0);
                            tEpaAnt += (parseFloat(row['_EPA_ValorAnterior']) || 0);
                            tEpaPres += (parseFloat(row['_EPA_ValorPresente']) || 0);
                        });
                        tAva = (avancesPorItem[getNorm(norm)] || 0);
                    }

                    memoPrice[norm] = tPrice;
                    memoHH[norm] = tHH;
                    memoAva[norm] = tAva;
                    memoEpaValAct[norm] = tEpaAct;
                    memoEpaValAnt[norm] = tEpaAnt;
                    memoEpaValPres[norm] = tEpaPres;
                    return { price: tPrice, hh: tHH, ava: tAva, epaValAct: tEpaAct, epaValAnt: tEpaAnt, epaValPres: tEpaPres };
                };

                return sortedItems.map(it => {
                    const clean = (v) => {
                        if (typeof v === 'number') return v;
                        let s = String(v || '').trim();
                        if (!s) return 0;
                        if (s.includes('.') && s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
                        if (s.includes(',') && !s.includes('.')) return parseFloat(s.replace(',', '.')) || 0;
                        return parseFloat(s) || 0;
                    };
                    const res = getSumsRecursive(getNorm(it.Item));
                    return {
                        ...it,
                        _TotalCalc: res.price,
                        _HHNum: res.hh,
                        _AvanceFisico: res.ava,
                        _EPA_ValorActual: res.epaValAct,
                        _EPA_ValorAnterior: res.epaValAnt,
                        _EPA_ValorPresente: res.epaValPres,
                        _CantidadNum: clean(it['Cantidad']),
                        _PrecioUNum: clean(it['Precio_Unitario']),
                        _HHNumOriginal: clean(it['HH_Total']),
                        _RendNum: clean(it['Rendimiento'] || 0)
                    };
                });
            };

            const parseFile = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', raw: true });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                        if (rawJson.length === 0) {
                            resolve({ data: [], errs: ['El archivo está vacío o sin datos.'] });
                            return;
                        }

                        const parsedData = rawJson.map((rowObj, i) => {
                            const row = {};
                            const objKeys = Object.keys(rowObj);
                            
                            const findVal = (list) => {
                                const key = objKeys.find(k => {
                                    const nk = k.toLowerCase().trim().replace(/_/g, ' ');
                                    return list.some(c => nk === c.toLowerCase().trim().replace(/_/g, ' '));
                                });
                                return key !== undefined ? rowObj[key] : '';
                            };

                            row['Item'] = findVal(['Item', 'Itemizado', 'It']);
                            row['Descripcion_Item'] = findVal(['Descripcion_Item', 'Descripcion', 'Descripción']);
                            row['Concepto'] = findVal(['Concepto']);
                            row['Responsable'] = findVal(['Responsable', 'Resp']);
                            row['Unidad_Medida'] = findVal(['Unidad_Medida', 'Unidad', 'Unid', 'Unidad_M']);
                            row['Cantidad'] = findVal(['Cantidad', 'Cant']);
                            row['HH_Total'] = findVal(['HH_Total', 'HH Tot', 'HH']);
                            row['Precio_Unitario'] = findVal(['Precio_Unitario', 'P.Unit', 'Precio Unit']);
                            row['Rendimiento'] = findVal(['Rendimiento', 'Rend']);
                            row['Precio_Total'] = findVal(['Precio_Total', 'P.Total', 'Total']);
                            
                            row._lineaOriginal = i + 2;
                            row._id = Date.now() + i;
                            return row;
                        }).filter(r => String(r['Item']).trim() !== '');

                        const finalData = calculateHierarchyTotals(parsedData);
                        resolve({ data: finalData, errs: [] });
                    };
                    reader.onerror = (e) => reject(e);
                    reader.readAsArrayBuffer(file);
                });
            };

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setNombreArchivo(file.name);
                try {
                    const { data, errs } = await parseFile(file);
                    setErrores(errs);
                    if (errs.length === 0 && data.length > 0) {
                        const withObra = data.map(r => ({ ...r, _obraId: obraSeleccionada.id, _obraNombre: obraSeleccionada.nombre }));
                        setItemizado(withObra);
                        setFase('preview');
                    } else if (errs.length > 0) {
                        setItemizado([]);
                        setFase('carga');
                    }
                } catch (error) {
                    console.error("Error al procesar el archivo:", error);
                    setErrores(['Error al leer el archivo. Asegúrate de que sea un formato válido.']);
                    setItemizado([]);
                    setFase('carga');
                } finally {
                    // Reset file input to allow re-uploading the same file
                    if (fileInputRef.current) {
                        fileInputRef.current.value = '';
                    }
                }
            };

            const handleConfirmar = () => {
                askConfirm(
                    'Confirmar Carga de Itemizado',
                    `¿Deseas guardar ${itemizado.length} ítems asociados a "${obraSeleccionada.nombre}"? Esto reemplazará cualquier itemizado previo de esta obra.`,
                    () => {
                        updateItemizadosGlobal(obraSeleccionada.id, itemizado);
                        showSuccess(`✓ ${itemizado.length} ítems cargados exitosamente en "${obraSeleccionada.nombre}"`);
                        setFase('saved');
                        setNombreArchivo('');
                        setEditRowId(null);
                    }
                );
            };

            const handleEditChange = (id, field, value) => {
                setItemizado(prev => {
                    const newList = prev.map(row => row._id === id ? { ...row, [field]: value } : row);
                    return calculateHierarchyTotals(newList);
                });
            };

            const handleEPAEdit = (id, field, value) => {
                setItemizado(prev => {
                    const newList = prev.map(row => {
                        if (row._id === id) {
                            let updated = { ...row, [field]: value };
                            let pUnit = parseFloat(updated['_PrecioUNum']) || 0;
                            let cantTotal = parseFloat(updated['_CantidadNum']) || 0;
                            let numVal = parseFloat(value) || 0;

                            if (field === '_EPA_AvancePct') {
                                updated['_EPA_CantActual'] = cantTotal > 0 ? (numVal / 100) * cantTotal : 0;
                            } else if (field === '_EPA_CantActual') {
                                if (cantTotal > 0) {
                                    updated['_EPA_AvancePct'] = (numVal / cantTotal) * 100;
                                }
                            }
                            
                            let cAct = parseFloat(updated['_EPA_CantActual']) || 0;
                            let cAnt = parseFloat(updated['_EPA_CantAnterior']) || 0;
                            
                            updated['_EPA_ValorActual'] = cAct * pUnit;
                            updated['_EPA_ValorAnterior'] = cAnt * pUnit;
                            updated['_EPA_CantPresente'] = cAct - cAnt;
                            updated['_EPA_ValorPresente'] = updated['_EPA_CantPresente'] * pUnit;
                            return updated;
                        }
                        return row;
                    });
                    
                    const calculated = calculateHierarchyTotals(newList);
                    if (obraSeleccionada && updateItemizadosGlobal) {
                        updateItemizadosGlobal(obraSeleccionada, calculated);
                    }
                    return calculated;
                });
            };

            const handleDeleteRow = (id) => {
                askConfirm('Eliminar Ítem', '¿Estás seguro de eliminar este ítem del listado?', () => {
                    setItemizado(prev => {
                        const newList = prev.filter(row => row._id !== id);
                        return calculateHierarchyTotals(newList);
                    });
                    showSuccess('Ítem eliminado');
                });
            };

            const fmtNum = (n) => typeof n === 'number' ? Math.round(n).toLocaleString('es-CL') : n;
            const fmtMoney = (n) => '$' + Math.round(parseFloat(n) || 0).toLocaleString('es-CL');
            const fmtRend = (n) => Math.round(parseFloat(n) || 0).toLocaleString('es-CL');

            // Totales Generales (solo sumar raíces)
            const getNorm = (s) => String(s || '').trim().replace(/\.0$/, '');
            const allNorms = [...new Set(itemizado.map(r => getNorm(r.Item)))];
            const rootNorms = allNorms.filter(n => !allNorms.some(p => n.startsWith(getNorm(p) + '.') && n !== getNorm(p)));
            
            const totalGeneral = rootNorms.reduce((acc, n) => {
                const anyRow = itemizado.find(r => getNorm(r.Item) === n);
                return acc + (anyRow ? anyRow._TotalCalc : 0);
            }, 0);

            const totalHH = rootNorms.reduce((acc, n) => {
                const anyRow = itemizado.find(r => getNorm(r.Item) === n);
                return acc + (anyRow ? anyRow._HHNum : 0);
            }, 0);

            // Estilos ultra-compactos para la tabla
            const thCls = "p-2 px-2 font-bold text-slate-400 uppercase whitespace-nowrap text-[9px] tracking-tighter";
            const tdCls = "p-2 px-2 text-[11px]";
            const inputCls = "w-full border border-blue-300 rounded px-1.5 py-0.5 text-[10px] outline-none focus:ring-2 focus:ring-blue-400 bg-white shadow-sm";

            return (
                <div class="space-y-4 text-left">
                    {/* Encabezado */}
                    <div class="flex justify-between items-center gap-2">
                        <button
                            class="text-slate-500 text-xs font-bold flex items-center gap-1.5 hover:text-blue-600 transition-colors whitespace-nowrap"
                            onClick={() => { setFase('seleccion'); setItemizado([]); setObraSeleccionada(null); setNombreArchivo(''); setEditRowId(null); onVolver && onVolver(); }}
                        >
                            ← Volver
                        </button>
                        <button
                            class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1.5 hover:bg-emerald-100 transition-all shadow-sm"
                            onClick={downloadPlantilla}
                        >
                            📥 Plantilla (.xlsx)
                        </button>
                    </div>

                    {/* Banner informativo compacto */}
                    <div class="bg-gradient-to-r from-blue-900 to-slate-900 text-white rounded-xl p-4 shadow-lg">
                        <div class="flex items-center gap-3">
                            <div class="text-2xl">📋</div>
                            <div class="flex-1">
                                <h3 class="font-extrabold text-sm mb-0.5 tracking-tight">Carga Masiva de Itemizado</h3>
                                <div class="flex flex-wrap gap-1 mt-1 opacity-80">
                                    {COLUMNAS.slice(0, 5).map(c => (
                                        <span key={c} class="px-1.5 py-0.5 bg-white/10 text-blue-100 rounded text-[8px] font-bold uppercase border border-white/10">{c.replace(/_/g, ' ')}</span>
                                    ))}
                                    <span class="text-[8px] font-bold text-blue-300">... y más</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Paso 1: Selección de Obra */}
                    <div class={`bg-white rounded-2xl border shadow-sm transition-all ${fase === 'seleccion' ? 'border-blue-200 shadow-blue-100' : 'border-slate-200'}`}>
                        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
                            <div class={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold flex-shrink-0 ${obraSeleccionada ? 'bg-green-500 text-white' : 'bg-blue-600 text-white'}`}>
                                {obraSeleccionada ? '✓' : '1'}
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">Seleccionar Obra Destino</h4>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Obra / Proyecto</label>
                                    <select
                                        class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium"
                                        value={obraSeleccionada?.id || ''}
                                        onChange={e => {
                                            const p = proyectos.find(x => x.id === parseInt(e.target.value));
                                            setObraSeleccionada(p || null);
                                            setEditRowId(null);
                                            setNombreArchivo('');
                                            setErrores([]);
                                            if (p) {
                                                const savedData = itemizadosPorProyecto[p.id];
                                                if (savedData && savedData.length > 0) {
                                                    setItemizado(savedData);
                                                    setFase('saved');
                                                } else {
                                                    setItemizado([]);
                                                    setFase('carga');
                                                }
                                            } else {
                                                setItemizado([]);
                                                setFase('seleccion');
                                            }
                                        }}
                                    >
                                        <option value="">-- Seleccione una obra --</option>
                                        {proyectos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                                    </select>
                                </div>
                                {obraSeleccionada && (
                                    <div class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
                                        <div class="w-9 h-9 rounded-full bg-green-500 flex items-center justify-center text-white font-extrabold text-sm">{obraSeleccionada.nombre.charAt(0)}</div>
                                        <div>
                                            <p class="font-extrabold text-green-800 text-sm">{obraSeleccionada.nombre}</p>
                                            <p class="text-green-600 text-[10px]">{obraSeleccionada.descripcion}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Paso 2: Mostrar itemizado guardado o zona de carga */}
                    {fase === 'saved' && obraSeleccionada && (
                        <div class="bg-white rounded-2xl border border-emerald-200 shadow-sm p-5 flex items-center justify-between gap-4 animate-in fade-in duration-300">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold text-sm">✓</div>
                                <div>
                                    <p class="font-extrabold text-emerald-800 text-sm">Itemizado cargado: {(itemizadosPorProyecto[obraSeleccionada.id] || []).length} ítems</p>
                                    <p class="text-emerald-600 text-[10px] mt-0.5">Obra: {obraSeleccionada.nombre}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button
                                    class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-md"
                                    onClick={() => { setFase('preview'); setItemizado(itemizadosPorProyecto[obraSeleccionada.id] || []); }}
                                >👁️ Ver Itemizado</button>
                                <label class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 transition-colors shadow-md cursor-pointer flex items-center gap-1.5">
                                    🔄 Reemplazar Excel
                                    <input type="file" accept=".xls,.xlsx,.csv" class="hidden" onChange={async (e) => {
                                        const file = e.target.files[0];
                                        if (!file) return;
                                        setNombreArchivo(file.name);
                                        try {
                                            const { data, errs } = await parseFile(file);
                                            setErrores(errs);
                                            if (errs.length === 0 && data.length > 0) {
                                                const withObra = data.map(r => ({ ...r, _obraId: obraSeleccionada.id, _obraNombre: obraSeleccionada.nombre }));
                                                setItemizado(withObra);
                                                setFase('preview');
                                            }
                                        } catch(err) {
                                            setErrores(['Error al leer el archivo.']);
                                        }
                                        if (e.target) e.target.value = '';
                                    }} />
                                </label>
                            </div>
                        </div>
                    )}

                    {/* Paso 2: Carga del Archivo (cuando no hay datos guardados) */}
                    {(fase === 'carga' || fase === 'preview') && (
                        <div class={`bg-white rounded-2xl border shadow-sm transition-all ${fase === 'carga' ? 'border-blue-200 shadow-blue-100' : 'border-slate-200'}`}>
                            <div class="p-5 border-b border-slate-100 flex items-center gap-3">
                                <div class={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold flex-shrink-0 ${fase === 'preview' ? 'bg-green-500 text-white' : 'bg-blue-600 text-white'}`}>
                                    {fase === 'preview' ? '✓' : '2'}
                                </div>
                                <h4 class="font-bold text-slate-800 text-sm">Subir Archivo XLS / CSV</h4>
                                {nombreArchivo !== '' && (
                                    <span class="ml-auto text-[10px] font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full">📄 {nombreArchivo}</span>
                                )}
                            </div>
                            <div class="p-6">
                                {errores.length > 0 && (
                                    <div class="mb-4 bg-red-50 border border-red-200 rounded-xl p-4">
                                        <p class="text-xs font-bold text-red-600 mb-1">⚠ Errores en el archivo:</p>
                                        {errores.map((e, i) => <p key={i} class="text-xs text-red-500">{e}</p>)}
                                    </div>
                                )}
                                <label class="block border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center bg-slate-50 hover:border-blue-400 hover:bg-blue-50/40 transition-all cursor-pointer group relative">
                                    <div class="text-5xl mb-3 opacity-20 group-hover:opacity-50 transition-opacity">📂</div>
                                    <p class="text-sm font-bold text-slate-500 group-hover:text-blue-600">Haz clic aquí para seleccionar tu archivo XLS o CSV</p>
                                    <p class="text-[10px] text-slate-400 mt-1">Archivos .xls, .xlsx o .csv · Formato: columnas según la plantilla</p>
                                    <input
                                        type="file"
                                        accept=".xls,.xlsx,.csv"
                                        class="absolute inset-0 opacity-0 cursor-pointer"
                                        onChange={handleUpload}
                                        ref={fileInputRef}
                                    />
                                </label>
                            </div>
                        </div>
                    )}

                    {/* Paso 3: Vista Previa y Confirmación */}
                    {fase === 'preview' && itemizado.length > 0 && (
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            {/* Cabecera con KPIs */}
                            <div class="p-5 border-b border-slate-100">
                                <div class="flex justify-between items-center mb-4">
                                    <div>
                                        <h4 class="font-extrabold text-slate-800 text-sm">Vista Previa — {itemizado.length} ítems cargados</h4>
                                        <p class="text-xs text-slate-400 mt-0.5">Obra: <span class="font-bold text-slate-600">{obraSeleccionada.nombre}</span></p>
                                    </div>
                                    <div class="flex gap-3">
                                        <button
                                            class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition-colors border border-slate-200"
                                            onClick={() => { setFase('carga'); setItemizado([]); setNombreArchivo(''); setEditRowId(null); }}
                                        >
                                            Cambiar Archivo
                                        </button>
                                        <button
                                            class="bg-blue-600 text-white px-6 py-2 rounded-xl text-xs font-bold shadow-lg shadow-blue-500/20 hover:bg-blue-700 transition-all flex items-center gap-2"
                                            onClick={handleConfirmar}
                                        >
                                            ✓ Confirmar y Guardar Itemizado
                                        </button>
                                    </div>
                                </div>
                                {/* KPIs */}
                                <div class="grid grid-cols-3 gap-4">
                                    <div class="bg-slate-50 rounded-lg p-2 border border-slate-100">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Ítems Totales</p>
                                        <p class="text-2xl font-extrabold text-slate-800">{itemizado.length}</p>
                                    </div>
                                    <div class="bg-blue-50 rounded-lg p-2 border border-blue-100">
                                        <p class="text-[9px] font-bold text-blue-400 uppercase tracking-widest">HH Totales</p>
                                        <p class="text-2xl font-extrabold text-blue-700">{fmtNum(totalHH)}</p>
                                    </div>
                                    <div class="bg-emerald-50 rounded-lg p-2 border border-emerald-100">
                                        <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest">Precio Total</p>
                                        <p class="text-lg font-extrabold text-emerald-700">{fmtMoney(totalGeneral)}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Tabla de Itemizado - Scroll horizontal solo si es necesario */}
                            {/* Dummy Scrollbar Superior */}
                            <div 
                                class="overflow-x-auto overflow-y-hidden sticky top-0 z-20 bg-slate-50"
                                ref={topScrollRef} 
                                onScroll={handleTopScroll}
                            >
                                <div style={{ height: '1px', width: isEstadoPago ? '1900px' : '1300px' }}></div>
                            </div>

                            {/* Tabla de Itemizado - Scroll horizontal solo si es necesario */}
                            <div 
                                class="overflow-x-auto overflow-y-visible"
                                ref={tableScrollRef}
                                onScroll={handleTableScroll}
                            >
                                <table class={`w-full text-left table-fixed ${isEstadoPago ? 'min-w-[1900px]' : 'min-w-[1300px]'}`}>
                                    {isEstadoPago ? (
                                        <thead class="bg-slate-50 border-b border-slate-100 shadow-sm sticky top-[14px] z-10">
                                            <tr>
                                                <th rowSpan={2} class={thCls} style={{width:'50px'}}>Ítem</th>
                                                <th rowSpan={2} class={thCls} style={{width:'auto', minWidth:'250px'}}>Descripción</th>
                                                <th rowSpan={2} class={thCls} style={{width:'150px'}}>Concepto</th>
                                                <th rowSpan={2} class={thCls} style={{width:'100px'}}>Resp.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'60px', textAlign:'center'}}>Unid.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'80px', textAlign:'right'}}>Cant.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'80px', textAlign:'right'}}>HH Tot.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'90px', textAlign:'right'}}>P. Unit.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'80px', textAlign:'right'}}>Rend.</th>
                                                <th rowSpan={2} class={thCls} style={{width:'100px', textAlign:'right'}}>P. Total</th>
                                                {isObra && <th rowSpan={2} class={thCls} style={{width:'100px', textAlign:'right', backgroundColor: '#fdf2f2', color: '#dc2626'}}>Ava. Fisico</th>}
                                                
                                                <th colSpan={3} class={`${thCls} text-center border-x border-slate-200`} style={{backgroundColor: '#e5e7eb'}}>Acumulado Estado de Pago Actual ($)</th>
                                                <th colSpan={2} class={`${thCls} text-center border-r border-slate-200`} style={{backgroundColor: '#d1d5db'}}>Acumulado Estado de Pago Anterior ($)</th>
                                                <th colSpan={2} class={`${thCls} text-center border-r border-slate-200`} style={{backgroundColor: '#e5e7eb'}}>Presente Estado de Pago ($)</th>
                                                
                                                <th rowSpan={2} class={thCls} style={{width:'100px', textAlign:'center'}}>Acciones</th>
                                            </tr>
                                            <tr>
                                                <th class={`${thCls} border-l border-slate-200`} style={{width:'80px', textAlign:'center', backgroundColor: '#f3f4f6'}}>Avance %</th>
                                                <th class={thCls} style={{width:'80px', textAlign:'right', backgroundColor: '#f3f4f6'}}>(a) Cantidad</th>
                                                <th class={thCls} style={{width:'100px', textAlign:'right', backgroundColor: '#f3f4f6'}}>(b) Valor [$]</th>
                                                
                                                <th class={`${thCls} border-l border-slate-300`} style={{width:'80px', textAlign:'right', backgroundColor: '#e5e7eb'}}>(c) Cantidad</th>
                                                <th class={thCls} style={{width:'100px', textAlign:'right', backgroundColor: '#e5e7eb'}}>(d) Valor [$]</th>
                                                
                                                <th class={`${thCls} border-l border-slate-200`} style={{width:'90px', textAlign:'right', backgroundColor: '#f3f4f6'}}>(a-c) = E Cant.</th>
                                                <th class={`${thCls} border-r border-slate-200`} style={{width:'110px', textAlign:'right', backgroundColor: '#f3f4f6'}}>E x P.U Valor</th>
                                            </tr>
                                        </thead>
                                    ) : (
                                        <thead class="bg-slate-50 border-b border-slate-100 shadow-sm sticky top-[14px] z-10">
                                            <tr>
                                                <th class={thCls} style={{width:'50px'}}>Ítem</th>
                                                <th class={thCls} style={{width:'auto', minWidth:'250px'}}>Descripción</th>
                                                <th class={thCls} style={{width:'150px'}}>Concepto</th>
                                                <th class={thCls} style={{width:'100px'}}>Resp.</th>
                                                <th class={thCls} style={{width:'60px', textAlign:'center'}}>Unid.</th>
                                                <th class={thCls} style={{width:'80px', textAlign:'right'}}>Cant.</th>
                                                <th class={thCls} style={{width:'80px', textAlign:'right'}}>HH Tot.</th>
                                                <th class={thCls} style={{width:'90px', textAlign:'right'}}>P. Unit.</th>
                                                <th class={thCls} style={{width:'80px', textAlign:'right'}}>Rend.</th>
                                                <th class={thCls} style={{width:'100px', textAlign:'right'}}>P. Total</th>
                                                {isObra && <th class={thCls} style={{width:'100px', textAlign:'right', backgroundColor: '#fdf2f2', color: '#dc2626'}}>Ava. Fisico</th>}
                                                <th class={thCls} style={{width:'100px', textAlign:'center'}}>Acciones</th>
                                            </tr>
                                        </thead>
                                    )}

        // ============================================================
        //  COMPONENTE: CubicacionesPage - Planilla Dinámica Inteligente
        // ============================================================
        const CubicacionesPage = ({ actividades, setActividades, unidades, proyectos, ponderaciones, especialidades, itemizadosPorProyecto, showSuccess, askConfirm }) => {
            const { useState, useEffect } = React;
            
            const [activeProject, setActiveProject] = useState('');
            const [activeEspecialidadFilter, setActiveEspecialidadFilter] = useState('');
            const [activeActivityFilter, setActiveActivityFilter] = useState('');
            const [activeTab, setActiveTab] = useState('fisico'); // 'fisico' | 'edp'
            const [infoColumns, setInfoColumns] = useState(() => {
                const saved = localStorage.getItem('cubicaciones_info_columns');
                const base = ['Item', 'Descripción', 'Elemento', 'Ubicación'];
                if (!saved) return base;
                const parsed = JSON.parse(saved);
                
                // Normalizar nombres antiguos (mayúsculas) para evitar duplicados
                const nameMap = {
                    'ITEM': 'Item',
                    'DESCRIPCIÓN': 'Descripción',
                    'DESCRIPCION': 'Descripción',
                    'DESCRIPCIÓN DEL ITEM': 'Descripción',
                    'ELEMENTO': 'Elemento',
                    'UBICACIÓN': 'Ubicación',
                    'UBICACION': 'Ubicación'
                };
                
                let merged = parsed.map(col => nameMap[col.toUpperCase()] || col);
                
                // Eliminar duplicados manteniendo primera aparición
                merged = merged.filter((item, pos) => merged.indexOf(item) === pos);

                // Migration: ensure 'Item' and 'Descripción' always exist
                if (!merged.includes('Item')) merged.unshift('Item');
                if (!merged.includes('Descripción')) merged.splice(1, 0, 'Descripción');
                
                return merged;
            });
            const [newColName, setNewColName] = useState('');
            const [showNewColForm, setShowNewColForm] = useState(false);
            const [itemizadoSearch, setItemizadoSearch] = useState('');
            const [showItemizadoDropdown, setShowItemizadoDropdown] = useState(false);
            const [edpItemFilter, setEdpItemFilter] = useState('');
            const [edpModal, setEdpModal] = useState({ show: false, periodo: '' });

            // Persistir orden de columnas
            React.useEffect(() => {
                localStorage.setItem('cubicaciones_info_columns', JSON.stringify(infoColumns));
            }, [infoColumns]);

            const moveColumn = (index, direction) => {
                const newCols = [...infoColumns];
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= newCols.length) return;
                const temp = newCols[index];
                newCols[index] = newCols[newIndex];
                newCols[newIndex] = temp;
                setInfoColumns(newCols);
            };

            const removeColumn = (col) => {
                if (['Elemento', 'Ubicación'].includes(col)) return; // Columnas base no se borran
                setInfoColumns(infoColumns.filter(c => c !== col));
            };

            const [rows, setRows] = useState([]);
            const [hoveredCol, setHoveredCol] = useState(null);
            const [dragSubIdx, setDragSubIdx] = useState(null); // índice de la columna que se está arrastrando
            const [dragOverSubIdx, setDragOverSubIdx] = useState(null); // índice donde se está sobrevolando
            
            // Estado para el popup de adjuntar documentos
            const [uploadModal, setUploadModal] = useState({ show: false, rowId: null, type: 'Plano', file: null, activeFilter: 'Todos' });

            const handleDownloadAttachment = (att) => {
                if (!att.data) {
                    alert("⚠️ Este documento fue adjunto sin datos de descarga (versión anterior). Debe volver a adjuntarlo para poder descargarlo.");
                    return;
                }
                const link = document.createElement('a');
                link.href = att.data;
                link.download = att.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleAddAttachment = () => {
                if (!uploadModal.file) {
                    alert("⚠️ Debe seleccionar un archivo primero.");
                    return;
                }

                const file = uploadModal.file;
                const filename = file.name;
                const docType = uploadModal.type;

                const saveAttachment = (fileData) => {
                    setRows(prevRows => {
                        const newRows = prevRows.map(r => {
                            if (r.id === uploadModal.rowId) {
                                const currentAttachments = r.attachments || [];
                                return {
                                    ...r,
                                    attachments: [{ 
                                        name: filename, 
                                        type: docType, 
                                        data: fileData,
                                        date: new Date().toLocaleDateString('es-CL') + ' ' + new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })
                                    }, ...currentAttachments]
                                };
                            }
                            return r;
                        });
                        
                        const key = `cubicaciones_data_${activeProject}_${activeActivityFilter}`;
                        try {
                            localStorage.setItem(key, JSON.stringify(newRows));
                            setTimeout(() => {
                                setUploadModal({ show: false, rowId: null, type: 'Plano', file: null, activeFilter: 'Todos' });
                                showSuccess(`✓ Documento "${filename}" adjunto correctamente.`);
                            }, 50);
                            return newRows;
                        } catch (e) {
                            alert("❌ El archivo excede la memoria local disponible en su navegador. Por favor suba un PDF más liviano, o borre otros documentos adjuntos para liberar espacio.");
                            return prevRows; // Cancel state update to prevent UI crash
                        }
                    });
                };

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxDimension = 800; // Reducido de 1000 para ahorrar espacio
                            
                            if (width > height && width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            } else if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            // Bajamos calidad a 0.4 para documentos de prueba
                            const compressedData = canvas.toDataURL('image/jpeg', 0.4);
                            saveAttachment(compressedData);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = e.target.result;
                        // Si es PDF muy pesado (> 1.5MB), advertir
                        if (data.length > 1.5 * 1024 * 1024) {
                            if (!confirm("⚠️ El archivo es bastante pesado y podría superar la capacidad de almacenamiento del navegador. ¿Desea intentar subirlo de todas formas?")) {
                                return;
                            }
                        }
                        saveAttachment(data);
                    };
                    reader.onerror = () => alert("❌ Error al leer el documento.");
                    reader.readAsDataURL(file);
                }
            };
            
            const isEmptyRow = (r) => {
                const hasFisico = Object.values(r.subActivityProgress || {}).some(val => val !== '' && val !== null);
                const hasEDP = Object.values(r.subActivityProgressEDP || {}).some(val => val !== '' && val !== null);
                if (hasFisico || hasEDP) return false;
                for (const [k, v] of Object.entries(r.mathParams || {})) {
                    if (k === 'cantidad') {
                        if (v !== 1 && v !== '1' && v !== '') return false;
                    } else {
                        if (v !== '' && v !== null) return false;
                    }
                }
                return true;
            };

            // Función de padding eliminada para mostrar solo filas con datos
            const getOneEmptyRow = (actId, unitId) => {
                return {
                    id: Date.now(),
                    attachments: [],
                    infoFields: {},
                    actividadId: actId || '',
                    unidadId: unitId || '',
                    partidaId: '',
                    mathParams: { cantidad: 1, valorManual: '' },
                    subActivityProgress: {},
                    subActivityProgressEDP: {}
                };
            };

            // Cargar datos por Obra y Actividad
            useEffect(() => {
                if (activeProject && activeActivityFilter) {
                    const actId = parseInt(activeActivityFilter);
                    const actObj = actividades.find(a => a.id === actId);
                    const unitId = actObj ? actObj.unidadId : '';

                    const key = `cubicaciones_data_${activeProject}_${activeActivityFilter}`;
                    const savedData = localStorage.getItem(key);
                    let loadedRows = [];
                    if (savedData) {
                        try {
                            loadedRows = JSON.parse(savedData);
                            
                            // Validar y actualizar si la unidad de la actividad cambió en el mantenedor
                            loadedRows = loadedRows.map(r => {
                                if (r.actividadId === actId && r.unidadId !== unitId) {
                                    return {
                                        ...r,
                                        unidadId: unitId,
                                        mathParams: { cantidad: r.mathParams?.cantidad || 1 }, 
                                        subActivityProgress: {} // Limpiar avance ya que la base de la unidad acaba de ser reiniciada
                                    };
                                }
                                return r;
                            });

                        } catch(e) { }
                    }
                    // Si no hay datos, mostrar una tabla completamente vacía hasta que el usuario añada.
                    setRows(loadedRows);
                } else {
                    setRows([]);
                }
            }, [activeProject, activeActivityFilter]);

            // Sincronizar el formulario con la Actividad seleccionada
            useEffect(() => {
                if (activeActivityFilter) {
                    const actId = parseInt(activeActivityFilter);
                    const actObj = actividades.find(a => a.id === actId);
                    if (actObj) {
                        setFormData(prev => ({
                            ...prev,
                            actividadId: actId,
                            unidadId: actObj.unidadId || ''
                        }));
                    }
                }
            }, [activeActivityFilter, actividades]);

            const handleSaveGeneral = () => {
                if (!activeProject || !activeActivityFilter) {
                    alert('Debe seleccionar Obra y Actividad para guardar.');
                    return;
                }
                const rowsToSave = rows.filter(r => !isEmptyRow(r));
                
                // VALIDACIÓN DE CAMPOS OBLIGATORIOS
                const requiredFields = ['Item', 'Descripción', 'Ubicación', 'Elemento'];
                let hasErrors = false;
                for (let i = 0; i < rowsToSave.length; i++) {
                    const r = rowsToSave[i];
                    for (const req of requiredFields) {
                        const val = r.infoFields[req];
                        if (val === undefined || val === null || val.toString().trim() === '') {
                            const rowDisplayNum = rows.findIndex(row => row.id === r.id) + 1;
                            alert(`❌ Error al guardar.\nFila N°${rowDisplayNum}: El campo obligatorio "${req}" está vacío.\nDebe completarlo para continuar.`);
                            hasErrors = true;
                            break;
                        }
                    }
                    if (hasErrors) break;
                }
                if (hasErrors) return;

                const key = `cubicaciones_data_${activeProject}_${activeActivityFilter}`;
                localStorage.setItem(key, JSON.stringify(rowsToSave));
                // Espejo unidireccional → CUB_PROGRAMA (solo lectura en destino)
                const mirrorKey = `cubprograma_data_${activeProject}_${activeActivityFilter}`;
                localStorage.setItem(mirrorKey, JSON.stringify(rowsToSave));
                alert('✔ Avance guardado exitosamente para la obra y actividad actual.');
            };

            const handleGuardarEDPClick = () => {
                if (!activeProject || !activeActivityFilter) {
                    alert('Debe seleccionar Obra y Actividad para guardar EDP.');
                    return;
                }
                setEdpModal({ show: true, periodo: '' });
            };

            const confirmSaveEDP = () => {
                if (!edpModal.periodo) {
                    alert('Debe ingresar un periodo válido (Año y Mes).');
                    return;
                }
                
                askConfirm(
                    'Confirmar Guardado EDP',
                    `¿Está seguro de guardar la foto actual del EDP para el periodo ${edpModal.periodo}? Esta acción quedará registrada en el Histórico EDP.`,
                    () => {
                        // Filtrar por ítem si el usuario tiene un filtro activo en la vista EDP
                        const sourceRows = (activeTab === 'edp' && edpItemFilter)
                            ? rows.filter(r => (r.infoFields['Item'] || '') === edpItemFilter)
                            : rows;

                        const rowsToSave = sourceRows.filter(r => !isEmptyRow(r)).map(r => {
                            const act = actividades.find(a => a.id == r.actividadId);
                            // Pre-calcular el avance EDP en este momento para congelarlo
                            const avance = calculateExecutedQty(r, act, 'parcial');
                            return {
                                ...r,
                                _AvanceEDP: avance,
                                _Takeoff: calculateTakeoff(r)
                            };
                        });
                        
                        const proj = proyectos.find(p => p.id == activeProject);
                        const act = actividades.find(a => a.id == activeActivityFilter);
                        const unit = unidades.find(u => u.id == act?.unidadId);
                        
                        // Snapshot de la configuración de la actividad y unidad
                        const snapshotConfig = {
                            actividad: act ? { ...act } : null,
                            unidad: unit ? { ...unit } : null
                        };
                        
                        const newEntry = {

            const exportToExcel = () => {

                                        subActHTML += `<td style="padding: 3px; border: 1px solid #e2e8f0; text-align: center; font-size: 8px; color: #78350f;">${valStr}</td>`;

                    // HTML para documentos fotográficos / imágenes estructuradas

                    for (const r of activeRows) {
                        if (!r.attachments || r.attachments.length === 0) continue;
                        
                        const cod = r.infoFields['Item'] || '-';
                        const desc = r.infoFields['Descripción'] || r.infoFields['Descripcion'] || '-';
                        
                        // Solo conservar el último documento (el más reciente, índice 0) por cada tipo

                    fullHTML += `</div>`; // Cerrar div maestro temporal

                    const opt = {

                    // Exportar PDF a ArrayBuffer puro usando html2pdf

                    const wsname = wb.SheetNames[0];

                    const data = XLSX.utils.sheet_to_json(ws, {header: 1});

                        alert('El archivo está vacío o no tiene datos de cubicación.');
                        e.target.value = null;
                        return;
                    }
                    
                    const headers = data[0].map(h => String(h || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));

                    const actObj = actividades.find(a => a.id === actId);
                    const unitId = actObj ? actObj.unidadId : '';
                    
                    // Función para normalizar nombres de columnas para comparación
                    const norm = (s) => String(s || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                    let nextId = Date.now();
                    for(let i = 1; i < data.length; i++) {
                        const rowData = data[i];
                        if (!rowData || rowData.length === 0) continue;
                        
                        const newRow = {
                            id: nextId++,
                            isFileAttached: false,
                            infoFields: {},
                            actividadId: actId || '',
                            unidadId: unitId || '',
                            mathParams: { cantidad: 1 },
                            subActivityProgress: {},

                        };
                        
                        let hasAnyData = false;

                            const val = rowData[idx] !== undefined ? rowData[idx] : '';
                            if (val !== '') hasAnyData = true;
                            
                            const normalizedH = norm(h);
                            
                            // Mapeo flexible

                                // Encontrar el nombre original de la columna en infoColumns
                                const originalCol = infoColumns.find(col => norm(col) === normalizedH);

                                // Buscar si coincide con algún parámetro de la unidad
