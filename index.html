                    if (act.id !== actId) return act;
                    return { ...act, subActividades: (act.subActividades || []).map(s =>
                        s.id === subId ? { ...s, [fieldKey]: val } : s
                    )};
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
                showSuccess(`Ponderación ${isEDP ? 'EDP' : 'Física'} actualizada.`);
            };

            const updateSubActivityName = (actId, subId, newName) => {
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    return { ...act, subActividades: (act.subActividades || []).map(s =>
                        s.id === subId ? { ...s, nombre: newName } : s
                    )};
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
            };

            const addSubActivityDirectly = (actId) => {
                const isEDP = activeTab === 'edp';
                const newSub = { id: Date.now(), nombre: 'Nueva Sub', desc: '', porcentaje: isEDP ? 0 : 10, porcentajeEDP: isEDP ? 10 : 0 };
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    return { ...act, subActividades: [...(act.subActividades || []), newSub] };
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
                showSuccess('✅ Sub-actividad añadida con 10%. Edita el nombre y % en el encabezado.');
            };

            const deleteSubActivityDirectly = (actId, subId) => {
                askConfirm('Eliminar Sub-actividad', '¿Está seguro de eliminar esta columna? Los datos de progreso se perderán.', () => {
                    const updated = actividades.map(act => {
                        if (act.id !== actId) return act;
                        return { ...act, subActividades: (act.subActividades || []).filter(s => s.id !== subId) };
                    });
                    setActividades(updated);
                    localStorage.setItem('app_actividades', JSON.stringify(updated));
                    showSuccess('Sub-actividad eliminada.');
                });
            };

            const reorderSubActivities = (actId, fromIdx, toIdx) => {
                if (fromIdx === toIdx) return;
                const updated = actividades.map(act => {
                    if (act.id !== actId) return act;
                    const subs = [...(act.subActividades || [])];
                    const [moved] = subs.splice(fromIdx, 1);
                    subs.splice(toIdx, 0, moved);
                    return { ...act, subActividades: subs };
                });
                setActividades(updated);
                localStorage.setItem('app_actividades', JSON.stringify(updated));
            };

            const handleActivityChange = (rowId, actIdStr) => {
                const actId = parseInt(actIdStr) || '';
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                        return { ...r, actividadId: actId, subActivityProgress: {} };
                    }
                    return r;
                }));
            };

            const handleUnitChange = (rowId, unitIdStr) => {
                const unitId = parseInt(unitIdStr) || '';
                setRows(rows.map(r => {
                    if (r.id === rowId) {
                    return { ...r, unidadId: unitId, mathParams: { cantidad: 1 } };
                    }
                    return r;
                }));
            };

            const calculateTakeoff = (row) => {
                if (!row) return 0;
                const m = row.mathParams || {};
                const cant = parseFloat(m.cantidad) >= 0 ? parseFloat(m.cantidad) : 1;
                
                // 1. Prioridad Manual (Si es mayor a 0)
                const manual = parseFloat(m.valorManual) || 0;
                
                // 2. Cálculo por parámetros/fórmula
                let formulaResult = 0;
                const unit = unidades.find(u => u.id == row.unidadId);
                if (unit && unit.params && unit.params.length > 0) {
                    let hasParamValue = false;
                    const pMap = {};
                    unit.params.forEach(p => {
                        const val = parseFloat(m[p]);
                        if (!isNaN(val) && m[p] !== '' && m[p] !== null) {
                           pMap[p] = val;
                           if (val > 0) hasParamValue = true;
                        } else {
                           pMap[p] = 0;
                        }
                    });

                    if (hasParamValue) {
                        let base = 1;
                        if (unit.formula && unit.formula.trim() !== '') {
                           try {
                               let fs = unit.formula.toLowerCase().replace(/\^/g, '**');
                               unit.params.forEach(p => {
                                   const reg = new RegExp('\\b' + p.toLowerCase().trim() + '\\b', 'g');
                                   fs = fs.replace(reg, `(${pMap[p] || 0})`);
                               });
                               base = new Function(`return ${fs}`)() || 0;
                           } catch(e) { base = 0; }
                        } else {
                           unit.params.forEach(p => { base *= (pMap[p] || 0); });
                        }
                        formulaResult = base;
                    }
                }

                let finalBase = 0;
                if (manual > 0) {
                    finalBase = manual;
                } else if (formulaResult > 0) {
                    finalBase = formulaResult;
                }

                const takeoff = (finalBase * cant) || 0;
                return Math.round(takeoff * 100) / 100;
            };

            const getWeightSetting = (actId, subId) => {
                if (!activeProject || !actId) return 0;
                const key = `${activeProject}_${actId}_${subId}`;
                const config = ponderaciones[key];
                
                // Priorizar configuración por proyecto (EDP > Planificador > Cubicador)
                if (config) {
                    const projectWeight = parseFloat(config.edp) || parseFloat(config.planificador) || parseFloat(config.cubicador);
                    if (projectWeight !== undefined && projectWeight !== 0) return projectWeight;
                }

                // Fallback: Buscar en el maestro de actividades
                const act = actividades.find(a => a.id === actId);
                const sub = act?.subActividades?.find(s => s.id === subId);
                return parseFloat(sub?.porcentaje) || 0;
            };

            const calculatePhysicalProgress = (row, act, excludeProtocolo = false) => {
                if (!act || !act.subActividades || act.subActividades.length === 0) return 0;
                const takeoff = calculateTakeoff(row);
                const fisicaData = row?.subActivityProgress || {};
                const allSubs = act.subActividades || [];
                let totalPhysical = 0;
                let weightSum = 0;

                allSubs.forEach(sub => {
                    if (!sub) return;
                    const isProt = (sub.nombre || '').toLowerCase().includes('protocolo');
                    if (excludeProtocolo && isProt) return;

                    const weight = parseFloat(sub.porcentaje) || 0;
                    if (weight <= 0) return;
                    
                    const qty = parseFloat(fisicaData[sub.id]) || 0;
                    totalPhysical += qty * weight / 100;
                    weightSum += weight;
                });
                
                if (excludeProtocolo) {
                    if (weightSum <= 0 || takeoff <= 0) return 0;
                    const expected = (weightSum / 100) * takeoff;
                    if (expected <= 0) return 0;
                    return (totalPhysical / expected) * 100;
                }
                return totalPhysical;
            };

            const calculateExecutedQty = (row, act, mode = 'parcial') => {
                if (!act || !act.subActividades || act.subActividades.length === 0) return 0;

                const isEDP = activeTab === 'edp';
                const fisicaData = row.subActivityProgress || {};
                const edpData = row.subActivityProgressEDP || {};
                const allSubs = act.subActividades;
                let totalExecuted = 0;

                const takeoff = calculateTakeoff(row);

                if (isEDP) {
                    const physicalP = takeoff > 0 ? (calculatePhysicalProgress(row, act) / takeoff * 100) : 0;
                    
                    // EDP: agrupar por el campo 'grupoEDP' (o 'nombre' si está vacío)
                    const groupsMap = {};
                    allSubs.forEach(s => {
                        const gName = (s.grupoEDP || s.nombre || '').trim();
                        if (!groupsMap[gName]) groupsMap[gName] = { name: gName, weight: 0, subs: [] };
                        groupsMap[gName].weight += (parseFloat(s.porcentajeEDP) || 0);
                        groupsMap[gName].subs.push(s);
                    });

                    Object.values(groupsMap).forEach(g => {
                        if (g.weight <= 0) return;
                        
                        const isProtocolo = (g.name || '').toLowerCase().includes('protocolo');
                        
                        if (isProtocolo) {
                            // Lógica Protocolo: Solo si físico base (no protocolo) == 100%
                            const physicalBaseP = calculatePhysicalProgress(row, act, true);
                            if (physicalBaseP >= 99.9) { 
                                const subId = g.subs && g.subs[0] ? g.subs[0].id : null;
                                const manualVal = subId ? (parseFloat(edpData[subId]) || 0) : 0;
                                totalExecuted += manualVal * g.weight / 100;
                            }
                        } else {
                            // Lógica estricta: El avance EDP solo cuenta si TODAS las sub-actividades físicas del grupo tienen avance
                            const fyzVals = g.subs.map(s => parseFloat(fisicaData[s.id]) || 0);
                            const allHaveProgress = fyzVals.length > 0 && fyzVals.every(v => v > 0);
                            
                            if (allHaveProgress) {
                                const avg = fyzVals.reduce((a, b) => a + b, 0) / fyzVals.length;
                                totalExecuted += avg * g.weight / 100;
                            }
                        }
                    });
                } else {
                    // FÍSICO
                    if (mode === 'real') {
                        const subsReal = allSubs.filter(s => !(s.nombre || '').toLowerCase().includes('protocolo'));
                        if (subsReal.length === 0) return 0;

                        const sumVal = subsReal.reduce((acc, s) => acc + (parseFloat(fisicaData[s.id]) || 0), 0);
                        totalExecuted = sumVal / subsReal.length;
                    } else {
                        totalExecuted = calculatePhysicalProgress(row, act);
                    }
                }

                return Math.round(totalExecuted * 100) / 100;
            };


            const renderSubActivities = (row, act, maxSubs) => {
                if (!act || !act.subActividades || act.subActividades.length === 0)
                    return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                const isEDP = activeTab === 'edp';
                const allSubs = act.subActividades;
                const fisicaData = row.subActivityProgress || {};

                if (isEDP) {
                    // ---- MODO EDP ----
                    // Agrupar por grupoEDP
                    const groupsList = [];
                    allSubs.forEach(s => {
                        const gName = (s.grupoEDP || s.nombre || '').trim();
                        let g = groupsList.find(x => x.name === gName);
                        if (!g) {
                            g = { name: gName, weight: 0, subs: [] };
                            groupsList.push(g);
                        }
                        g.weight += (parseFloat(s.porcentajeEDP) || 0);
                        g.subs.push(s);
                    });

                    const activeGroups = groupsList.filter(g => g.weight > 0);
                    if (activeGroups.length === 0)
                        return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                    const takeoff = calculateTakeoff(row);
                    const physicalP = takeoff > 0 ? (calculatePhysicalProgress(row, act) / takeoff * 100) : 0;
                    const edpData = row.subActivityProgressEDP || {};

                    return (
                        <td class="p-0 border border-slate-200 bg-amber-50/10" colSpan={maxSubs}>
                            <div class="flex h-full min-h-[48px]">
                                {activeGroups.map((g, idx) => {
                                    const isProtocolo = (g.name || '').toLowerCase().includes('protocolo');
                                    const firstSubId = g.subs && g.subs[0] ? g.subs[0].id : null;

                                    if (isProtocolo) {
                                        const physicalBaseP = calculatePhysicalProgress(row, act, true);
                                        const isEnabled = physicalBaseP >= 99.9; 
                                        return (
                                            <div key={g.name || idx} class={`flex-1 min-w-[110px] p-1 flex flex-col items-center justify-center gap-0.5 ${idx < activeGroups.length - 1 ? 'border-r border-amber-100' : ''} ${isEnabled ? 'bg-emerald-50' : 'bg-slate-100 opacity-60'}`}>
                                                {!isEnabled && <span class="text-[8px] font-bold text-slate-400 uppercase">Bloq. &lt; 100% Fís.</span>}
                                                <input
                                                    type="number"
                                                    disabled={!isEnabled}
                                                    class={`w-full text-center border-none bg-transparent rounded p-1 text-[13px] outline-none ${isEnabled ? 'focus:ring-1 focus:ring-emerald-400 font-black text-emerald-900' : 'text-slate-400 font-bold'}`}
                                                    placeholder={isEnabled ? "0.00" : "-"}
                                                    value={(isEnabled && firstSubId) ? (edpData[firstSubId] || '') : ''}
                                                    onChange={e => firstSubId && updateSubActivityProgress(row.id, firstSubId, e.target.value)}
                                                />
                                            </div>
                                        );
                                    }

                                    const fisicaVals = g.subs.map(s => parseFloat(fisicaData[s.id]) || 0);
                                    const allHaveProgress = fisicaVals.length > 0 && fisicaVals.every(v => v > 0);
                                    const avg = (allHaveProgress && fisicaVals.length > 0) ? (fisicaVals.reduce((a, b) => a + b, 0) / fisicaVals.length) : 0;
                                    
                                    return (
                                        <div key={g.name || idx} class={`flex-1 min-w-[110px] p-1 flex flex-col items-center justify-center gap-0.5 ${idx < activeGroups.length - 1 ? 'border-r border-amber-100' : ''} bg-amber-50/20`}>
                                            <span class="text-[14px] font-black text-amber-900">
                                                {(allHaveProgress && !isNaN(avg)) ? avg.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </td>
                    );
                } else {
                    // ---- MODO FÍSICO ----
                    const filteredSubs = allSubs.filter(s => (parseFloat(s.porcentaje) || 0) > 0);
                    if (filteredSubs.length === 0)
                        return <td class="p-3 border border-slate-200 text-center text-slate-400 text-xs italic" colSpan={maxSubs}>-</td>;

                    return (
                        <td class="p-0 border border-slate-200 bg-slate-50/20" colSpan={maxSubs}>
                            <div class="flex h-full min-h-[40px]">
                                {filteredSubs.map((sub, idx) => (
                                    <div key={sub.id} class={`flex-1 min-w-[120px] p-1 flex items-center justify-center ${idx !== filteredSubs.length - 1 ? 'border-r border-slate-100' : ''}`}>
                                        <input
                                            type="number"
                                            class="w-full text-center border-none bg-transparent rounded p-1 text-[11px] outline-none focus:ring-1 focus:ring-blue-400 font-bold text-slate-700 transition-all h-8"
                                            placeholder="0.0"
                                            value={fisicaData[sub.id] || ''}
                                            onChange={e => updateSubActivityProgress(row.id, sub.id, e.target.value)}
                                        />
                                    </div>
                                ))}
                            </div>
                        </td>
                    );
                }
            };

            let maxSubActivities = 1;
            const isEDP_view = activeTab === 'edp';
            rows.forEach(r => {
                if (r.actividadId) {
                    const act = actividades.find(a => a.id === r.actividadId);
                    if (act && act.subActividades) {
                        const filtered = (act.subActividades || []).filter(sub => {
                            const weight = isEDP_view ? (parseFloat(sub.porcentajeEDP) || 0) : (parseFloat(sub.porcentaje) || 0);
                            return weight > 0;
                        });
                        if (filtered.length > maxSubActivities) {
                            maxSubActivities = filtered.length;
                        }
                    }
                }
            });
            
            // El botón de agregar ya no está en la tabla → effectiveMaxSubs = maxSubActivities alone
            const effectiveMaxSubs = maxSubActivities;

            let maxMathParams = 2;
            rows.forEach(r => {
                if (r.unidadId) {
                    const u = unidades.find(un => un.id === r.unidadId);
                    if (u && u.params && u.params.length > maxMathParams) {
                        maxMathParams = u.params.length;
                    }
                }
            });

            const getColWidth = (col) => {
                const c = col.toLowerCase();
                if (c === 'item') return 70;
                if (c === 'descripción' || c === 'descripcion' || c === 'desc') return 350;
                if (c === 'ubicación' || c === 'ubicacion') return 200;
                if (c === 'elemento') return 150;
                return 120;
            };

            return (
                <div class="space-y-4">
                    {/* Header & Settings */}
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <span class="text-3xl">📊</span>
                                <div>
                                    <h2 class="font-extrabold text-slate-800 text-xl">Planilla de Cubicaciones</h2>
                                    <p class="text-xs text-slate-500">Avance y cálculo dinámico (Ponderaciones heredadas del proyecto)</p>
                                </div>
                            </div>

                            <div class="flex flex-col gap-3 border-t md:border-t-0 border-slate-100 pt-4 md:pt-0">
                                {/* Row 1: Filters + Add Column */}
                                <div class="flex flex-col sm:flex-row items-center gap-3">
                                    <div class="w-full sm:w-56">
                                        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Proyecto Activo</label>
                                        <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-blue-50 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-800 cursor-pointer shadow-sm" value={activeProject} onChange={e => {
                                            setActiveProject(e.target.value);
                                            setActiveEspecialidadFilter('');
                                            setActiveActivityFilter('');
                                        }}>
                                            <option value="">-- Seleccionar Obra --</option>
                                            {proyectos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                                        </select>
                                    </div>
                                    {activeProject && (
                                        <div class="w-full sm:w-52 animate-in fade-in zoom-in duration-300">
                                            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Especialidad</label>
                                            <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600 cursor-pointer shadow-sm"
                                                    value={activeEspecialidadFilter} 
                                                    onChange={e => {
                                                        setActiveEspecialidadFilter(e.target.value);
                                                        setActiveActivityFilter(''); 
                                                    }}>
                                                <option value="">-- Todas las Especialidades --</option>
                                                {especialidades && especialidades.map(esp => (
                                                    <option key={esp.id} value={esp.id}>{esp.nombre}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    {activeProject && (
                                        <div class="w-full sm:w-52 animate-in fade-in zoom-in duration-300">
                                            <label class="block text-[9px] font-bold text-amber-500 uppercase tracking-widest mb-1.5 ml-1">Actividad a Cubicar</label>
                                            <select class="w-full border border-amber-200 rounded-lg p-2.5 text-sm bg-amber-50 focus:ring-2 focus:ring-amber-500 outline-none font-bold text-amber-800 cursor-pointer shadow-sm" value={activeActivityFilter} onChange={e => setActiveActivityFilter(e.target.value)}>
                                                <option value="">-- Seleccionar Actividad --</option>
                                                {proyectos.find(p => p.id === parseInt(activeProject))?.actividades.map(actId => {
                                                    const act = actividades.find(a => a.id === actId);
                                                    if (!act) return null;
                                                    if (activeEspecialidadFilter && act.especialidadId != activeEspecialidadFilter) return null;
                                                    return <option key={actId} value={actId}>{act.nombre}</option>;
                                                })}
                                            </select>
                                        </div>
                                    )}
                                    {activeTab !== 'edp' && (
                                        <button class="w-full sm:w-auto bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-200 flex items-center justify-center gap-2 transition-colors mt-0 sm:mt-5" onClick={() => { setShowNewColForm(!showNewColForm); }}>
                                            <span>+</span> Añadir Columna
                                        </button>
                                    )}
                                </div>
                                {/* Row 2: Action buttons — only when project+activity selected */}
                                {activeProject && activeActivityFilter && (
                                    <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 animate-in fade-in slide-in-from-top-2 duration-300">
                                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mr-1">Acciones:</span>
                                        {activeTab !== 'edp' && (
                                            <>
                                                <button class="bg-slate-100 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-xs font-bold hover:bg-slate-200 flex items-center gap-1.5 transition-colors shadow-sm" onClick={downloadTemplate}>
                                                    <span>📥</span> Plantilla
                                                </button>
                                                <label class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 flex items-center gap-1.5 transition-colors shadow-md cursor-pointer">
                                                    <span>📤</span> Subir Excel
                                                    <input type="file" accept=".xlsx, .xls" class="hidden" onChange={handleFileUpload} />
                                                </label>
                                                <div class="h-5 w-px bg-slate-200 mx-1"></div>
                                            </>
                                        )}
                                        <button class="bg-green-700 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-green-800 flex items-center gap-1.5 transition-colors shadow-md" onClick={exportToExcel}>
                                            <span>📊</span> Exportar Excel
                                        </button>
                                        {activeTab === 'edp' && (
                                            <button id="btn-export-pdf" class="bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-red-700 flex items-center gap-1.5 transition-colors shadow-md" onClick={exportToPDF}>
                                                <span>📄</span> Exportar EDP
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {showNewColForm && (
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex gap-2 items-center animate-in slide-in-from-top-2 shadow-inner">
                            <input type="text" placeholder="Ej: Piso, Sector, Plano Referencia" class="border border-slate-300 rounded px-3 py-2 text-sm outline-none w-64 focus:ring-2 focus:ring-blue-400 bg-white shadow-sm" value={newColName} onChange={e => setNewColName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddColumn()} />
                            <button class="bg-blue-600 text-white px-5 py-2 rounded font-bold text-sm hover:bg-blue-700 shadow-md" onClick={handleAddColumn}>Agregar Columna</button>
                            <button class="text-slate-400 font-bold hover:text-slate-600 px-3" onClick={() => setShowNewColForm(false)}>Cancelar</button>
                        </div>
                    )}

                    {activeProject && !activeActivityFilter && (
                        <div class="bg-amber-50 border-2 border-dashed border-amber-200 rounded-2xl p-12 text-center shadow-inner mt-4 animate-in fade-in zoom-in duration-300">
                            <div class="text-amber-300 text-6xl mb-4">📋</div>
                            <h3 class="text-xl font-extrabold text-amber-800">Seleccione una Actividad</h3>
                            <p class="text-amber-600/70 mt-2 text-sm">Seleccione una actividad en el menú superior para comenzar a ingresar o visualizar cubicaciones.</p>
                        </div>
                    )}

                    {activeProject && activeActivityFilter && (
                        <div class="bg-white p-5 rounded-xl shadow-lg border border-slate-200 animate-in fade-in slide-in-from-top-4 duration-500" id="tabla-cubicaciones-container">
                            
                            {/* Tabs Estilo Excel */}
                            <div class="flex border-b border-slate-200 mb-6 bg-slate-50 rounded-t-xl overflow-hidden">
                                <button 
                                    class={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-all flex items-center gap-2 border-r border-slate-200 ${activeTab === 'fisico' ? 'bg-white text-blue-600 border-b-2 border-b-blue-500 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}
                                    onClick={() => setActiveTab('fisico')}
                                >
                                    <span class="text-base">🏗️</span> Avance Físico
                                </button>
                                <button 
                                    class={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-all flex items-center gap-2 ${activeTab === 'edp' ? 'bg-white text-amber-600 border-b-2 border-b-amber-500 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}

                                                    onDragStart={(e) => {

                                                        e.preventDefault();
                                                        e.dataTransfer.dropEffect = 'move';

                                                        const fromIdx = parseInt(e.dataTransfer.getData('colIndex'));

                    if (item) {
                        const parsed = JSON.parse(item);
                        // Validation: If we expect an array but get something else, reject it
                        if (Array.isArray(initialValue) && !Array.isArray(parsed)) {
                            console.warn(`Local storage value for ${key} is not an array, falling back to default.`);
                            return initialValue;
                        }
                        return parsed;
                    }
                    return initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    localStorage.setItem(key, JSON.stringify(state));
                } catch (error) {
                    console.error('Error saving to localStorage', error);
                }
            }, [key, state]);

            return [state, setState];
        };

        // === MÓDULO: HistoricoEDPPage ===
        const HistoricoEDPPage = ({ proyectos, askConfirm, showSuccess }) => {
            const { useState, useEffect } = React;
            const [selectedProj, setSelectedProj] = useState('');
            const [selectedEstado, setSelectedEstado] = useState('todos');
            const [itemSearch, setItemSearch] = useState('');
            const [periodoSearch, setPeriodoSearch] = useState('');
            const [history, setHistory] = useState([]);
            const [viewDetail, setViewDetail] = useState(null); // EDP seleccionado para ver detalle
            const [commentModal, setCommentModal] = useState({ show: false, edpId: null, status: '', text: '' });

            useEffect(() => {
                const historyKey = 'historico_edp_data';
                const data = JSON.parse(localStorage.getItem(historyKey) || '[]');
                setHistory(data);
            }, []);

            const filteredHistory = history.filter(h => {
                const matchProj = selectedProj ? h.proyectoId == selectedProj : true;
                const matchEstado = selectedEstado !== 'todos' ? h.estado.toLowerCase() === selectedEstado : true;
                const matchItem = itemSearch ? h.data.some(row => (row.infoFields['Item'] || '').toLowerCase().includes(itemSearch.toLowerCase())) : true;
                const matchPeriodo = periodoSearch ? (h.periodo || '').toLowerCase().includes(periodoSearch.toLowerCase()) : true;
                return matchProj && matchEstado && matchItem && matchPeriodo;
            });

            const handleDeleteRecord = (id) => {
                askConfirm(
                    '¿Eliminar Registro Histórico?',
                    'Esta acción es irreversible y eliminará esta "foto" del estado de pago de los registros. Solo se permite eliminar registros rechazados.',
                    () => {
                        const updated = history.filter(h => h.id !== id);
                        setHistory(updated);
                        localStorage.setItem('historico_edp_data', JSON.stringify(updated));
                        showSuccess('Registro eliminado correctamente');
                    }
                );
            };

            const handleStatusChangeClick = (id, newStatus) => {
                setCommentModal({ show: true, edpId: id, status: newStatus, text: '' });
            };

            const confirmStatusChange = () => {
                if (!commentModal.text.trim()) {
                    alert('Debe ingresar un comentario o motivo para el cambio de estado.');
                    return;
                }

                const updated = history.map(h => h.id === commentModal.edpId ? { 
                    ...h, 
                    estado: commentModal.status,
                    comentario: commentModal.text,
                    fechaDecision: new Date().toLocaleString()
                } : h);

                setHistory(updated);
                localStorage.setItem('historico_edp_data', JSON.stringify(updated));
                showSuccess(`Estado actualizado a ${commentModal.status}`);
                
                if (viewDetail && viewDetail.id === commentModal.edpId) {
                    setViewDetail({ 
                        ...viewDetail, 
                        estado: commentModal.status, 
                        comentario: commentModal.text,
                        fechaDecision: new Date().toLocaleString()
                    });
                }
                setCommentModal({ show: false, edpId: null, status: '', text: '' });
            };

            const fmtNum = (val) => {
                if (val === undefined || val === null || val === '') return '—';
                return Number(val).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            };

            const renderSubActivitiesReadOnly = (row, config) => {
                const act = config?.actividad;
                if (!act || !act.subActividades || act.subActividades.length === 0) return <td class="p-2 border border-slate-200 text-center text-slate-400">-</td>;

                // Agrupar por grupoEDP (basado en el snapshot)
                const groupsMap = {};
                act.subActividades.forEach(s => {
                    const gName = (s.grupoEDP || s.nombre || '').trim();
                    if (!groupsMap[gName]) groupsMap[gName] = { name: gName, weight: 0, subs: [] };
                    groupsMap[gName].weight += (parseFloat(s.porcentajeEDP) || 0);
                    groupsMap[gName].subs.push(s);
                });

                const activeGroups = Object.values(groupsMap).filter(g => g.weight > 0);
                const fisicaData = row.subActivityProgress || {};
                const edpData = row.subActivityProgressEDP || {};

                return (
                    <td class="p-0 border border-slate-200 bg-amber-50/5">
                        <div class="flex h-full min-h-[40px]">
                            {activeGroups.map((g, idx) => {
                                const isProtocolo = (g.name || '').toLowerCase().includes('protocolo');
                                let val = 0;

                                if (isProtocolo) {
                                    const firstSubId = g.subs && g.subs[0] ? g.subs[0].id : null;
                                    val = firstSubId ? (parseFloat(edpData[firstSubId]) || 0) : 0;
                                } else {
                                    // Lógica EDP Automática: promedio de física si todos tienen algo
                                    const fyzVals = g.subs.map(s => parseFloat(fisicaData[s.id]) || 0);
                                    const allHaveProgress = fyzVals.length > 0 && fyzVals.every(v => v > 0);
                                    val = allHaveProgress ? (fyzVals.reduce((a, b) => a + b, 0) / fyzVals.length) : 0;
                                }
                                
                                return (
                                    <div key={idx} class={`flex-1 min-w-[80px] p-2 flex flex-col items-center justify-center gap-0.5 ${idx < activeGroups.length - 1 ? 'border-r border-amber-100' : ''}`}>
                                        <span class={`text-[12px] font-black ${val > 0 ? 'text-amber-900' : 'text-slate-300'}`}>{val > 0 ? fmtNum(val) : '0,00'}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </td>
                );
            };

            return (
                <div class="space-y-6">

                                </button>

                                    {viewDetail.estado !== 'Aprobado' && (

                                            <span>✓</span> Aprobar EDP
                                        </button>

                                    {viewDetail.estado !== 'Rechazado' && (
                                        <button class="bg-red-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-red-700 transition-all shadow-lg shadow-red-500/20 flex items-center gap-2" onClick={() => handleStatusChangeClick(viewDetail.id, 'Rechazado')}>

                                                    {viewDetail.estado}

                                                                </div>

                                                    </div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100">
                                            {viewDetail.data.map((row, idx) => {
                                                const config = viewDetail.config || {};
                                                const m = row.mathParams || {};
                                                const cant = m.cantidad || 1;
                                                const takeoff = row._Takeoff || 0;

                                                let renderFormula = null;
                                                const manual = parseFloat(m.valorManual);
                                                if (!isNaN(manual) && manual > 0) {
                                                    renderFormula = (
                                                        <div class="flex flex-col items-center justify-center">
                                                            <span class="text-[9px] text-slate-400 font-bold bg-slate-200 px-1.5 py-0.5 rounded uppercase tracking-wider mb-0.5">Manual</span>
                                                            <span class="text-xs font-black text-slate-700">{manual}</span>
                                                        </div>
                                                    );
                                                } else if (config.unidad?.params?.length > 0) {
                                                    const parts = config.unidad.params.map(p => {
                                                        const val = m[p] || '0';
                                                        return `<span class="text-slate-400 font-medium">${p}:</span> <span class="text-slate-700 font-bold">${val}</span>`;
                                                    });
                                                    renderFormula = (
                                                        <div class="flex flex-col items-center justify-center gap-1">
                                                            <div class="text-[9px] flex gap-2 flex-wrap justify-center items-center bg-white px-2 py-1 rounded shadow-sm border border-slate-100" dangerouslySetInnerHTML={{__html: parts.join(' <span class="text-slate-300 mx-0.5">x</span> ')}}></div>
                                                            <div class="flex items-center gap-1 bg-indigo-50 px-2 py-0.5 rounded text-[10px] border border-indigo-100">
                                                                <span class="text-indigo-400 font-bold uppercase">Cant:</span>
                                                                <span class="font-black text-indigo-700">{cant}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                } else {
                                                    renderFormula = (
                                                        <div class="flex flex-col items-center justify-center">
                                                            <span class="text-slate-400 font-bold text-xs">-</span>
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <tr key={idx} class="hover:bg-slate-50/50 transition-colors">
                                                        <td class="px-3 py-2 text-center text-slate-400 font-bold">{idx + 1}</td>

                                                        </td>
                                                        <td class="px-3 py-2 text-center bg-slate-50/30">
                                                            {renderFormula}
                                                        </td>
                                                        <td class="px-3 py-2 text-center font-bold text-slate-800">{fmtNum(takeoff)}</td>
                                                        {renderSubActivitiesReadOnly(row, config)}
                                                        <td class="px-3 py-2 text-center font-black text-indigo-700 bg-indigo-50/50 border-l border-indigo-100 text-sm">
                                                            {fmtNum(avance)}
                                                        </td>
                                                        <td class="px-3 py-2 text-center font-black text-emerald-700 bg-emerald-50/20 border-l border-slate-100 text-sm">
                                                            {fmtNum(porc)}%
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                        <tfoot class="bg-red-600 text-white sticky bottom-0 z-20">
                                            <tr>
                                                <td colSpan="5" class="px-3 py-2 text-right font-black uppercase text-[10px] tracking-widest text-red-200 border-r border-white/10">Totales Globales:</td>
                                                <td class="px-3 py-2 text-center font-black text-white text-sm border-r border-white/10">
                                                    {fmtNum(viewDetail.data.reduce((acc, r) => acc + (r._Takeoff || 0), 0))}
                                                </td>
                                                <td class="px-3 py-2 text-right font-black uppercase text-[10px] tracking-widest text-red-200">Avance EDP Periodo:</td>
                                                <td class="px-3 py-2 text-center font-black text-emerald-400 text-lg border-l border-white/10">
                                                    {fmtNum(viewDetail.data.reduce((acc, r) => acc + (r._AvanceEDP || 0), 0))}
                                                </td>
                                                <td class="px-3 py-2 text-center font-black text-white text-lg border-l border-white/10 bg-red-700 shadow-inner">
                                                    {(() => {
                                                        const totalT = viewDetail.data.reduce((acc, r) => acc + (r._Takeoff || 0), 0);
                                                        const totalA = viewDetail.data.reduce((acc, r) => acc + (r._AvanceEDP || 0), 0);
                                                        return totalT > 0 ? fmtNum(totalA / totalT * 100) : '0';
                                                    })()}%
                                                </td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div class="space-y-6 animate-in fade-in duration-500">
                            <div class="bg-gradient-to-br from-red-700 via-red-600 to-red-800 rounded-2xl px-8 py-6 text-white shadow-xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                                <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div class="flex items-center gap-5">
                                        <div class="w-16 h-16 bg-white/10 backdrop-blur-sm rounded-2xl border border-white/20 flex items-center justify-center text-3xl shadow-inner animate-float">
                                            📊
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-3 mb-1">
                                                <span class="bg-red-500 text-white px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-widest">Módulo Auditoría</span>
                                            </div>
                                            <h2 class="text-2xl font-extrabold tracking-tight mb-1 text-transparent bg-clip-text bg-gradient-to-r from-white to-red-100">Histórico de Estados de Pago</h2>
                                            <p class="text-red-100/80 font-medium max-w-2xl leading-relaxed text-xs">Panel ejecutivo para la revisión, aprobación y gestión de fotos históricas de EDP. Mantenga el control absoluto de sus periodos de facturación.</p>

                            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50 flex flex-wrap gap-6 items-end animate-in slide-in-from-top-4 duration-700">
                                <div class="flex-1 min-w-[280px]">
                                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-1">📍 Proyecto u Obra</label>
                                    <select class="w-full border border-slate-100 rounded-2xl p-4 text-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none bg-slate-50 font-bold text-slate-700 transition-all appearance-none cursor-pointer" value={selectedProj} onChange={e => setSelectedProj(e.target.value)}>

const LogAdicionalesPage = ({ proyectos, showSuccess, askConfirm }) => {
    const { useState, useEffect } = React;

    const [form, setForm] = useState(initialForm);

    useEffect(() => {
        if (obraSeleccionada) {
            const saved = localStorage.getItem(`log_adicionales_${obraSeleccionada}`);
            if (saved) setAdicionales(JSON.parse(saved));
            else setAdicionales([]);
        } else {
            setAdicionales([]);
        }
    }, [obraSeleccionada]);

    const saveAdicionales = (newAds) => {
        setAdicionales(newAds);
        localStorage.setItem(`log_adicionales_${obraSeleccionada}`, JSON.stringify(newAds));
    };

    const handleSave = () => {
        if (!form.numero || !form.descripcion) {
            alert('Por favor complete al menos el N° del adicional y la descripción.');
            return;
        }
        let newAds = [...adicionales];
        if (form.id) {
            const index = newAds.findIndex(a => a.id === form.id);
            if (index >= 0) {
                const oldAd = newAds[index];
                let historial = [...(oldAd.historialRevisiones || [])];
                
                // Migrar historialMontos si existe y no hay historialRevisiones
                if (historial.length === 0 && oldAd.historialMontos && oldAd.historialMontos.length > 0) {
                    oldAd.historialMontos.forEach((h, i) => {
                        historial.push({
                            revision: `Rev ${i}`,
                            fecha: h.fecha,
                            costoTotal: oldAd.costoTotal,
                            costoNeto: oldAd.costoNeto,
                            hhGastadas: oldAd.hhGastadas,
                            precioUnitario: oldAd.precioUnitario,
                            avance: oldAd.avance,
                            certeza: oldAd.certeza,
                            montoPresentado: h.monto
                        });
                    });
                } else if (historial.length === 0) {
                    historial.push({
                        revision: 'Rev 0',
                        fecha: oldAd.fechaCreacion || new Date().toLocaleString(),
                        costoTotal: oldAd.costoTotal,
                        costoNeto: oldAd.costoNeto,
                        hhGastadas: oldAd.hhGastadas,
                        precioUnitario: oldAd.precioUnitario,
                        avance: oldAd.avance,
                        certeza: oldAd.certeza,
                        montoPresentado: oldAd.montoPresentado
                    });
                }

                const lastRev = historial[historial.length - 1] || {};
                
                if (String(lastRev.costoTotal || '') !== String(form.costoTotal || '') ||
                    String(lastRev.costoNeto || '') !== String(form.costoNeto || '') ||
                    String(lastRev.hhGastadas || '') !== String(form.hhGastadas || '') ||
                    String(lastRev.precioUnitario || '') !== String(form.precioUnitario || '') ||
                    String(lastRev.avance || '') !== String(form.avance || '') ||
                    String(lastRev.certeza || '') !== String(form.certeza || '') ||
                    String(lastRev.montoPresentado || '') !== String(form.montoPresentado || '')) {
                    
                    historial.push({
                        revision: `Rev ${historial.length}`,
                        fecha: new Date().toLocaleString(),
                        costoTotal: form.costoTotal,
                        costoNeto: form.costoNeto,
                        hhGastadas: form.hhGastadas,
                        precioUnitario: form.precioUnitario,
                        avance: form.avance,
                        certeza: form.certeza,
                        montoPresentado: form.montoPresentado
                    });
                }
                newAds[index] = { ...form, historialRevisiones: historial };
            }
        } else {
            const newAd = { 
                ...form, 
                id: Date.now(),
                historialRevisiones: [{ 
                    revision: 'Rev 0',
                    fecha: new Date().toLocaleString(), 
                    costoTotal: form.costoTotal,
                    costoNeto: form.costoNeto,
                    hhGastadas: form.hhGastadas,
                    precioUnitario: form.precioUnitario,
                    avance: form.avance,
                    certeza: form.certeza,
                    montoPresentado: form.montoPresentado 
                }]
            };
            newAds.push(newAd);
        }
        
        saveAdicionales(newAds);

                if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;

            const val_aprob_monto = ad.aprob_monto !== undefined ? ad.aprob_monto : (isTerminado ? getMonto(lastRev) : '');
            const val_aprob_ok = ad.aprob_ok !== undefined ? ad.aprob_ok : isAprobado;

            const esp = (ad.especialidad || '').toLowerCase();
            const val_hhp_oocc = ad.hhp_oocc !== undefined ? ad.hhp_oocc : (esp.includes('civil') || esp.includes('obras') ? hhTotal : '');
            const val_hhp_estruct = ad.hhp_estruct !== undefined ? ad.hhp_estruct : (esp.includes('estruct') ? hhTotal : '');
            const val_hhp_piping = ad.hhp_piping !== undefined ? ad.hhp_piping : (esp.includes('piping') ? hhTotal : '');
            const val_hhp_mecanica = ad.hhp_mecanica !== undefined ? ad.hhp_mecanica : (esp.includes('mecanic') ? hhTotal : '');

            const isGeneral = !['civil','obras','estruct','piping','mecanic','electric','instrument','andamio'].some(k => esp.includes(k));
            const val_hhp_general = ad.hhp_general !== undefined ? ad.hhp_general : (isGeneral && hhTotal ? hhTotal : '');

            return {

                'Aprobación - N° Carta': ad.aprob_carta || '',

                'Aprobación - OK': val_aprob_ok ? 'Sí' : 'No',

        });

        const wb = XLSX.utils.book_new();

        XLSX.writeFile(wb, `Log_Adicionales_${obraSeleccionada}.xlsx`);

        { label: 'Anulada', bg: '#ffffff', textLeft: '#000000', textRight: '#000000' },
        { label: 'Presentada', bg: '#fff2cc', textLeft: '#a86716', textRight: '#000000' },
        { label: 'Rechazada', bg: '#fce4d6', textLeft: '#c00000', textRight: '#000000' }
    ];

    let tCant = 0, tPres = 0, tUlt = 0, tApro = 0;

        const cant = ads.length;
        const getMonto = (obj) => parseFloat(obj?.montoPresentado) || parseFloat(obj?.costoNeto) || parseFloat(obj?.costoTotal) || 0;

        const presupuestoInicial = ads.reduce((acc, a) => {
            let first;
            if (a.historialRevisiones && a.historialRevisiones.length > 0) {
                first = getMonto(a.historialRevisiones[0]);
            } else if (a.historialMontos && a.historialMontos.length > 0) {
                first = parseFloat(a.historialMontos[0].monto) || 0;
            } else {
                first = getMonto(a);
            }
            return acc + first;
        }, 0);

        const montoAprobado = st.label === 'Aprobada' ? ads.reduce((acc, a) => acc + getMonto(a), 0) : 0;
        
        tCant += cant; tPres += presupuestoInicial; tUlt += montoUltRev; tApro += montoAprobado;

                                            </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </>
                    )}
                </div>

                                <option value="Principal">Principal</option>
                                <option value="Subcontrato">Subcontrato</option>

                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Área</label>
                            <input type="text" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#1e5896]" value={form.area} onChange={e => setForm({...form, area: e.target.value})} />

                            <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#1e5896]" value={form.estadoObra} onChange={e => setForm({...form, estadoObra: e.target.value})}>

                                <option value="Obra no ejecutada">Obra no ejecutada</option>
                                <option value="Obra en ejecución">Obra en ejecución</option>
                                <option value="Obra ejecutada">Obra ejecutada</option>
                            </select>

                    </div>

                    <div class="mb-6">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Descripción del Trabajo</label>
                        <textarea class="w-full border border-slate-200 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-[#1e5896] min-h-[100px]" value={form.descripcion} onChange={e => setForm({...form, descripcion: e.target.value})}></textarea>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Info Referencial / Documento</label>
                            <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#1e5896]" value={form.infoReferencial} onChange={e => setForm({...form, infoReferencial: e.target.value})}>
                                <option value="">-- Seleccionar --</option>
                                {['Plano(s) referencial(es)','Croquis','Calc. Especiales','Bases Especiales','Bases Técnicas','Libro de obra','Otras especificaciones'].map(x => <option key={x} value={x}>{x}</option>)}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Razón Mod. Obra</label>
                            <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#1e5896]" value={form.razonMod} onChange={e => setForm({...form, razonMod: e.target.value})}>

                                {['Revisión Plano','Modificación de Terreno','Solicitud Emisa','Obra Adicional','Nuevo Trabajo'].map(x => <option key={x} value={x}>{x}</option>)}
                            </select>
                        </div>
                    </div>

                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={form.afectaPlazo} onChange={e => setForm({...form, afectaPlazo: e.target.checked})} class="w-4 h-4 text-[#1e5896] focus:ring-[#1e5896] rounded border-slate-300"/> <span class="text-sm font-bold text-slate-600">Plazo</span></label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={form.afectaCalidad} onChange={e => setForm({...form, afectaCalidad: e.target.checked})} class="w-4 h-4 text-[#1e5896] focus:ring-[#1e5896] rounded border-slate-300"/> <span class="text-sm font-bold text-slate-600">Calidad</span></label>

                                value={form.costoTotal !== '' && form.costoTotal != null ? '$' + Number(form.costoTotal).toLocaleString('es-CL') : ''} 
                                onChange={e => {
                                    const val = e.target.value.replace(/\D/g, '');
                                    const num = val ? parseInt(val, 10) : '';
                                    setForm({...form, costoTotal: num});
                                }} 
                            />
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Total Neto</label>

                                value={form.costoNeto !== '' && form.costoNeto != null ? '$' + Number(form.costoNeto).toLocaleString('es-CL') : ''} 
                                onChange={e => {
                                    const val = e.target.value.replace(/\D/g, '');
                                    const num = val ? parseInt(val, 10) : '';
                                    setForm({...form, costoNeto: num, montoPresentado: num});
                                }}
                            />

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">HH Gastadas</label>

                        </div>
                        <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100">

                        </div>
                        <div class="bg-amber-50/50 p-3 rounded-xl border border-amber-100 md:col-span-2">
                            <label class="block text-[10px] font-black text-amber-800 uppercase tracking-widest mb-2">Monto Presentado (Última Revisión)</label>
                            <div class="flex gap-2">
                                <input type="text" class="w-full border border-amber-200 rounded-lg p-2.5 text-sm outline-none font-black bg-amber-50 text-amber-900 cursor-not-allowed" 
                                    value={form.montoPresentado !== '' && form.montoPresentado != null ? '$' + Number(form.montoPresentado).toLocaleString('es-CL') : ''}

                                />

                                    <span>{(form.historialRevisiones || form.historialMontos || []).length} Rev(s) previas.</span>

                                    <option value="Aprobada">Aprobada</option>
                                    <option value="Rechazada">Rechazada</option>
                                    <option value="Anulada">Anulada</option>
                                </select>
                            </div>
                        )}
                        {(parseFloat(form.avance) !== 100 || parseFloat(form.certeza) !== 100) && (
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Estado del Adicional</label>
                                <select class="w-full border border-slate-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-slate-400 font-bold text-slate-600 bg-white" value={form.estado} onChange={e => setForm({...form, estado: e.target.value})}>
                                    <option value="Presentada">Presentada</option>
                                    <option value="Aprobada">Aprobada</option>
                                    <option value="Rechazada">Rechazada</option>
                                    <option value="Anulada">Anulada</option>
                                </select>
                            </div>
                        )}
                    </div>

                    {/* Tabla de Historial de Revisiones */}
                    {(form.historialRevisiones && form.historialRevisiones.length > 0) && (
                        <div class="mb-8 bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                            <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                                <h4 class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Historial de Revisiones</h4>
                                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 font-bold text-[9px] rounded-full">{form.historialRevisiones.length} Registros</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs whitespace-nowrap">
                                    <thead class="bg-white border-b border-slate-100 text-[9px] font-black text-slate-400 uppercase tracking-wider">
                                        <tr>
                                            <th class="px-4 py-3">Revisión</th>
                                            <th class="px-4 py-3">Fecha</th>
                                            <th class="px-4 py-3 text-right">Costo Total</th>
                                            <th class="px-4 py-3 text-right">Total Neto</th>
                                            <th class="px-4 py-3 text-right">HH Gastadas</th>
                                            <th class="px-4 py-3 text-right">P. Unitario</th>
                                            <th class="px-4 py-3 text-right">Monto Pres.</th>
                                            <th class="px-4 py-3 text-center">% Avance</th>
                                            <th class="px-4 py-3 text-center">% Certeza</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        {form.historialRevisiones.map((rev, i) => (
                                            <tr key={i} class="hover:bg-slate-50/50 transition-colors">
                                                <td class="px-4 py-2.5 font-black text-slate-700">{rev.revision}</td>
                                                <td class="px-4 py-2.5 text-[10px] text-slate-500">{rev.fecha}</td>
                                                <td class="px-4 py-2.5 text-right font-medium text-slate-600">{rev.costoTotal ? '$'+fmt(rev.costoTotal) : '-'}</td>
                                                <td class="px-4 py-2.5 text-right font-medium text-slate-600">{rev.costoNeto ? '$'+fmt(rev.costoNeto) : '-'}</td>
                                                <td class="px-4 py-2.5 text-right font-bold text-slate-600">{rev.hhGastadas ? fmt(rev.hhGastadas) : '-'}</td>
                                                <td class="px-4 py-2.5 text-right font-medium text-slate-600">{rev.precioUnitario ? '$'+fmt(rev.precioUnitario) : '-'}</td>
                                                <td class="px-4 py-2.5 text-right font-black text-amber-700 bg-amber-50/30">{rev.montoPresentado ? '$'+fmt(rev.montoPresentado) : '-'}</td>
                                                <td class="px-4 py-2.5 text-center font-bold text-blue-600 bg-blue-50/30">{rev.avance || 0}%</td>
                                                <td class="px-4 py-2.5 text-center font-bold text-indigo-600 bg-indigo-50/30">{rev.certeza || 0}%</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    <div class="flex justify-end gap-3 pt-6 border-t border-slate-100">
                        <button class="px-6 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors" onClick={() => setShowForm(false)}>Cancelar</button>
                        <button class="px-6 py-2.5 rounded-xl font-bold text-white bg-[#1e5896] hover:bg-blue-800 shadow-lg transition-all" onClick={handleSave}>Guardar Adicional</button>
                    </div>
                </div>
            )}
        </div>
    );
};

        let elementId = 'caratula-pdf-content';

        if (activeTab === 'declaracion') {
            elementId = 'declaracion-pdf-content';
            filename = 'Declaracion.pdf';
        } else if (activeTab === 'reclamaciones') {
            elementId = 'reclamaciones-pdf-content';

        } else if (activeTab === 'detalle') {
            elementId = 'detalle-pdf-content';
            filename = 'Detalle_Avance_' + itemSeleccionadoDetalle + '.pdf';
        }

        const element = document.getElementById(elementId);
        if (!element) return;

        // 1. Guardar estilos originales para restaurarlos después
        const originalStyles = new Map();
        let currentElement = element;
        
        while (currentElement && currentElement.tagName !== 'BODY') {
            originalStyles.set(currentElement, {
                overflow: currentElement.style.overflow,
                height: currentElement.style.height,
                maxHeight: currentElement.style.maxHeight
            });
            
            // Liberar restricciones para que el elemento se muestre completo sin scroll
            currentElement.style.overflow = 'visible';
            currentElement.style.height = 'auto';
            currentElement.style.maxHeight = 'none';
            
            currentElement = currentElement.parentElement;
        }

        // 2. Reemplazar inputs por divs temporalmente (evita bug de html2canvas con inputs blancos)
        const inputReplacements = [];
        const inputs = element.querySelectorAll('input, textarea');
        
        inputs.forEach(input => {
            const div = document.createElement('div');
            div.textContent = input.value;
            div.className = input.className;
            
            // Asegurar alineación sin romper el flujo de texto (inline)
            div.style.display = 'inline-flex';
            div.style.alignItems = 'center';
            if (input.classList.contains('text-center')) {
                div.style.justifyContent = 'center';
            } else if (input.classList.contains('text-right')) {
                div.style.justifyContent = 'flex-end';
            } else {
                div.style.justifyContent = 'flex-start';
            }
            
            if (input.tagName.toLowerCase() === 'textarea') {
                div.style.whiteSpace = 'pre-wrap';
                div.style.alignItems = 'flex-start';
            }
            
            // Ocultar input real e insertar div falso
            const originalDisplay = input.style.display;
            input.style.display = 'none';
            input.parentNode.insertBefore(div, input);
            
            inputReplacements.push({
                input: input,
                div: div,
                originalDisplay: originalDisplay
            });
        });

        try {
            // 3. Renderizar el elemento completo a un canvas
            const canvas = await html2canvas(element, {
                scale: 2, // Mayor resolución
                useCORS: true,
                scrollY: 0,
                backgroundColor: '#ffffff'
            });

            // 4. Crear el documento PDF en A4
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            const pdfWidth = doc.internal.pageSize.getWidth();
            const pdfHeight = doc.internal.pageSize.getHeight();
            const margin = 8; // Márgenes de 8mm
            
            const usableWidth = pdfWidth - (margin * 2);
            const usableHeight = pdfHeight - (margin * 2);

            const imgWidth = canvas.width;
            const imgHeight = canvas.height;

            // 5. Calcular la escala exacta para que quepa sí o sí en UNA página
            const ratio = Math.min(usableWidth / imgWidth, usableHeight / imgHeight);
            
            const finalWidth = imgWidth * ratio;
            const finalHeight = imgHeight * ratio;

            // Centrar horizontalmente
            const xOffset = margin + (usableWidth - finalWidth) / 2;
            const yOffset = margin; // Arriba

            const imgData = canvas.toDataURL('image/jpeg', 0.98);
            
            // Insertar la única imagen en el PDF
            doc.addImage(imgData, 'JPEG', xOffset, yOffset, finalWidth, finalHeight);
            doc.save(filename);

        } catch (error) {
            console.error('Error al generar PDF:', error);
            alert('Hubo un error al generar el PDF.');
        } finally {
            // 6. Restaurar el entorno a la normalidad
            for (const [el, styles] of originalStyles.entries()) {
                el.style.overflow = styles.overflow;
                el.style.height = styles.height;
                el.style.maxHeight = styles.maxHeight;
            }
            // Restaurar inputs
            inputReplacements.forEach(({input, div, originalDisplay}) => {
                input.style.display = originalDisplay;
                div.remove();
            });
        }
    };

                    const workbook = XLSX.read(dataArr, { type: 'array', cellDates: true });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (json.length < 2) return;

                    const formatDate = (val) => {
                        if (!val) return '';
                        try {
                            let d = val;
                            if (!(d instanceof Date)) d = new Date(val);
                            if (isNaN(d.getTime())) return val;
                            // Ajuste para evitar desfase de zona horaria al formatear YYYY-MM-DD
                            const year = d.getUTCFullYear();
                            const month = String(d.getUTCMonth() + 1).padStart(2, '0');
                            const day = String(d.getUTCDate()).padStart(2, '0');
                            return `${year}-${month}-${day}`;
                        } catch (e) {

                                                let pBudget = 0;
                                                itemizado.forEach(item => {

                                                        pBudget += parseFloat(item._TotalCalc) || 0;
                                                    }
                                                });
                                                totalBudgetGlobal += pBudget;

                                                // 2. Additionals
                                                const adsKey = `log_adicionales_${proj.id}`;
                                                let ads = [];
                                                try {
                                                    const rawAds = localStorage.getItem(adsKey);
                                                    if (rawAds) ads = JSON.parse(rawAds);

                                                if (!Array.isArray(ads)) ads = [];
                                                
                                                let pAds = 0;

                                                            }

                                                        pExecuted += (takeoff * (rowProgress / 100)) * price;
                                                    });
