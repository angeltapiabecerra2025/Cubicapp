<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIMI-CUB - Sistema de Cubicaciones</title>
    <!-- React & Tailwind CDN for Quick Visualization only -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS y html2pdf para exportaciones -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Icons (replacing Lucide for CDN)
        const Icon = ({ name }) => {
            const icons = {
                dashboard: "📊",
                cubicaciones: "📐",
                planificacion: "📅",
                mantenedores: "⚙️",
                status: "✔️",
                user: "👤",
                edit: "✏️",
                delete: "🗑️",
                plus: "➕",
                obra: "🏗️",
                materiales: "📦",
                bim: "🧊"
            };
            return <span>{icons[name] || "📦"}</span>;
        };

        const getNorm = (s) => String(s || '').trim().replace(/\.0$/, '');

        // ============================================================
        //  COMPONENTE: ModuloSuministros
        // ============================================================
        const ModuloSuministros = ({ proyectos, askConfirm, showSuccess, itemizadosPorProyecto }) => {
            const { useState, useEffect } = React;
            const [solicitudes, setSolicitudes] = useState([]);
            const [proveedores, setProveedores] = useState([]);
            const [insumos, setInsumos] = useState([]);
            const [view, setView] = useState('list'); // 'list' | 'form'
            const [formData, setFormData] = useState(null);
            const [filtroObra, setFiltroObra] = useState('');
            const [filtroEstado, setFiltroEstado] = useState('');
            const [filtroProveedor, setFiltroProveedor] = useState('');

            useEffect(() => {
                try {
                    setSolicitudes(JSON.parse(localStorage.getItem('suministros_solicitudes') || '[]'));
                    setProveedores(JSON.parse(localStorage.getItem('suministros_proveedores') || '[]'));
                    setInsumos(JSON.parse(localStorage.getItem('suministros_insumos') || '[]'));
                } catch (e) {
                    console.error("Error loading localStorage data:", e);
                    setSolicitudes([]);
                }
            }, []);

            const saveSols = (d) => { setSolicitudes(d); localStorage.setItem('suministros_solicitudes', JSON.stringify(d)); };
            const saveProv = (d) => { setProveedores(d); localStorage.setItem('suministros_proveedores', JSON.stringify(d)); };
            const saveIns = (d) => { setInsumos(d); localStorage.setItem('suministros_insumos', JSON.stringify(d)); };

            const handleCreate = () => {
                setFormData({
                    id: Date.now().toString(),
                    obraId: filtroObra || '',
                    items: [{ nombre: '', cantidad: 1, unidad: 'UN', prioridad: '1', fechaInicio: '', precioPresupuesto: 0 }],
                    estado: 'Cotización',
                    fechaSolicitud: new Date().toISOString().split('T')[0],
                    documentos: [],
                    numPedidoCompra: '',
                    comparativa: [
                        { id: '1', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [0], cantidadesOfrecidas: [1], plazosEntrega: [''], fechaTentativa: '', origen: 'Nacional' },
                        { id: '2', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [0], cantidadesOfrecidas: [1], plazosEntrega: [''], fechaTentativa: '', origen: 'Nacional' },
                        { id: '3', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [0], cantidadesOfrecidas: [1], plazosEntrega: [''], fechaTentativa: '', origen: 'Nacional' }
                    ],
                    proveedorGanadorId: null,
                    evaluacion: { calificacion: 0, comentario: '' },
                    fechaRecepcionReal: '',
                    observaciones: ''
                });
                setView('form');
            };

            const handleEdit = (sol) => {
                const normalized = JSON.parse(JSON.stringify(sol));
                // Asegurar campos base
                if (!normalized.items) normalized.items = [];
                if (!normalized.comparativa || normalized.comparativa.length === 0) {
                    normalized.comparativa = [
                        { id: '1', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [], cantidadesOfrecidas: [], plazosEntrega: [], fechaTentativa: '', origen: 'Nacional' },
                        { id: '2', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [], cantidadesOfrecidas: [], plazosEntrega: [], fechaTentativa: '', origen: 'Nacional' },
                        { id: '3', proveedorNombre: '', ofertaNum: '', ofertaFecha: '', precios: [], cantidadesOfrecidas: [], plazosEntrega: [], fechaTentativa: '', origen: 'Nacional' }
                    ];
                }
                // Asegurar arreglos internos para cada proveedor según cantidad de items
                normalized.comparativa.forEach(c => {
                    if (!c.precios || c.precios.length < normalized.items.length) {
                        const base = c.precios || [];
                        for (let i = base.length; i < normalized.items.length; i++) base.push(0);
                        c.precios = base;
                    }
                    if (!c.cantidadesOfrecidas || c.cantidadesOfrecidas.length < normalized.items.length) {
                        const base = c.cantidadesOfrecidas || [];
                        for (let i = base.length; i < normalized.items.length; i++) base.push(normalized.items[i].cantidad || 0);
                        c.cantidadesOfrecidas = base;
                    }
                    if (!c.plazosEntrega || c.plazosEntrega.length < normalized.items.length) {
                        const base = c.plazosEntrega || [];
                        for (let i = base.length; i < normalized.items.length; i++) base.push('');
                        c.plazosEntrega = base;
                    }
                });
                if (!normalized.evaluacion) normalized.evaluacion = { calificacion: 0, comentario: '' };
                
                setFormData(normalized);
                setView('form');
            };

            const handleSave = () => {
                if(!formData.obraId) return alert('Seleccione una Obra para el suministro.');
                if(formData.items.some(it => !it.nombre)) return alert('Indique el nombre de todos los insumos.');

                let newSols = [...solicitudes];
                const idx = newSols.findIndex(s => s.id === formData.id);
                if(idx >= 0) newSols[idx] = formData;
                else newSols.push(formData);

                // Actualizar lista global de insumos conocidos
                let updatedInsumos = [...insumos];
                formData.items.forEach(it => {
                    if(!updatedInsumos.includes(it.nombre.trim())) {
                        updatedInsumos.push(it.nombre.trim());
                    }
                });
                if(updatedInsumos.length !== insumos.length) saveIns(updatedInsumos);
                
                let newProv = [...proveedores];
                let pChanged = false;
                formData.comparativa.forEach(c => {
                    if(c.proveedorNombre && !newProv.includes(c.proveedorNombre.trim())) {
                        newProv.push(c.proveedorNombre.trim());
                        pChanged = true;
                    }
                });
                if(pChanged) saveProv(newProv);

                saveSols(newSols);
                showSuccess('Solicitud de Suministro Guardada');
                setView('list');
            };

            const handleDelete = (id) => {
                askConfirm('¿Está seguro de eliminar esta solicitud de suministro?', () => {
                    saveSols(solicitudes.filter(s => s.id !== id));
                    showSuccess('Suministro Eliminado');
                });
            };

            const addBusinessDays = (dateStr, days) => {
                if (!dateStr || !days || isNaN(days)) return '';
                // Usamos mediodía para evitar problemas de zona horaria al sumar días
                let date = new Date(dateStr + 'T12:00:00');
                let count = 0;
                let iterations = 0;
                const maxIterations = 1000; // Seguridad
                while (count < parseInt(days) && iterations < maxIterations) {
                    date.setDate(date.getDate() + 1);
                    let day = date.getDay();
                    if (day !== 0 && day !== 6) { // 0=Domingo, 6=Sábado
                        count++;
                    }
                    iterations++;
                }
                return date.toISOString().split('T')[0];
            };

            const syncPrecios = (newItems) => {
                const newData = {...formData, items: newItems};
                newData.comparativa = newData.comparativa.map(c => {
                    const newPrecios = [...(c.precios || [])];
                    const newCants = [...(c.cantidadesOfrecidas || [])];
                    const newPlazos = [...(c.plazosEntrega || [])];
                    
                    if (newItems.length > newPrecios.length) {
                        for (let i = newPrecios.length; i < newItems.length; i++) {
                            newPrecios.push(0);
                            newCants.push(newItems[i].cantidad || 0);
                            newPlazos.push('');
                        }
                    } else if (newItems.length < newPrecios.length) {
                        newPrecios.splice(newItems.length);
                        newCants.splice(newItems.length);
                        newPlazos.splice(newItems.length);
                    }
                    return {...c, precios: newPrecios, cantidadesOfrecidas: newCants, plazosEntrega: newPlazos};
                });
                setFormData(newData);
            };

            const calculateTotalProv = (prov, items = formData?.items) => {
                if(!prov || !prov.precios || !items) return 0;
                return items.reduce((acc, it, idx) => {
                    const precio = prov.precios[idx] || 0;
                    const cant = (prov.cantidadesOfrecidas && prov.cantidadesOfrecidas[idx] !== undefined) ? prov.cantidadesOfrecidas[idx] : it.cantidad;
                    return acc + (cant * precio);
                }, 0);
            };

            const calculatePresupuestoTotal = (items = formData?.items) => {
                if(!items) return 0;
                return items.reduce((acc, it) => acc + ((it.cantidad || 0) * (it.precioPresupuesto || 0)), 0);
            };

            const getMejorOpcion = (comp, items = formData?.items) => {
                const validos = comp.filter(c => calculateTotalProv(c, items) > 0);
                if(validos.length === 0) return null;
                return validos.reduce((min, p) => calculateTotalProv(p, items) < calculateTotalProv(min, items) ? p : min, validos[0]);
            };

            const getStats = () => {
                const stats = {};
                solicitudes.forEach(s => {
                    const ganador = (s.comparativa || []).find(c => c.id === s.proveedorGanadorId);
                    const mejorOpcion = getMejorOpcion(s.comparativa || [], s.items || []);
                    
                    (s.comparativa || []).forEach(c => {
                        if(!c.proveedorNombre) return;
                        const pName = c.proveedorNombre.trim();
                        if(!stats[pName]) {
                            stats[pName] = {
                                nombre: pName,
                                participaciones: 0,
                                victorias: 0,
                                mejorPrecioCount: 0,
                                calificaciones: [],
                                comentarios: [],
                                materiales: new Set(),
                                cumplimiento: { total: 0, atrasados: 0 }
                            };
                        }
                        const p = stats[pName];
                        p.participaciones++;
                        if(ganador && ganador.proveedorNombre === c.proveedorNombre) {
                            p.victorias++;
                            if(s.evaluacion?.calificacion > 0) {
                                p.calificaciones.push(s.evaluacion.calificacion);
                                if(s.evaluacion.comentario) {
                                    p.comentarios.push({ 
                                        comentario: s.evaluacion.comentario, 
                                        obra: proyectos.find(pr => String(pr.id) === String(s.obraId))?.nombre || 'Obra Desconocida',
                                        calificacion: s.evaluacion.calificacion,
                                        fecha: s.fechaSolicitud
                                    });
                                }
                            }
                            if(s.estado === 'Recepcionado' && s.fechaRecepcionReal && c.fechaTentativa) {
                                p.cumplimiento.total++;
                                if(new Date(s.fechaRecepcionReal) > new Date(c.fechaTentativa)) {
                                    p.cumplimiento.atrasados++;
                                }
                            }
                        }
                        if(mejorOpcion && mejorOpcion.proveedorNombre === c.proveedorNombre) {
                            p.mejorPrecioCount++;
                        }
                        (s.items || []).forEach(item => p.materiales.add(item.nombre));
                    });
                });
                return Object.values(stats).map(p => ({
                    ...p,
                    promedio: p.calificaciones.length > 0 ? (p.calificaciones.reduce((a,b)=>a+b,0)/p.calificaciones.length).toFixed(1) : 'N/A',
                    cumplimientoRate: p.cumplimiento.total > 0 ? (((p.cumplimiento.total - p.cumplimiento.atrasados) / p.cumplimiento.total) * 100).toFixed(0) : 'N/A'
                }));
            };

            const [evalSearch, setEvalSearch] = useState('');
            const statsData = getStats();
            const filteredStats = statsData.filter(p => 
                p.nombre.toLowerCase().includes(evalSearch.toLowerCase()) || 
                Array.from(p.materiales).some(m => m.toLowerCase().includes(evalSearch.toLowerCase()))
            );

            const filteredSols = solicitudes.filter(s => {
                 const matchObra = !filtroObra || String(s.obraId) === String(filtroObra);
                 const matchEstado = !filtroEstado || s.estado === filtroEstado;
                 const matchProveedor = !filtroProveedor || (s.comparativa || []).some(c => 
                     c.proveedorNombre?.toLowerCase().includes(filtroProveedor.toLowerCase())
                 );
                 return matchObra && matchEstado && matchProveedor;
             });

            return (
                <div class="space-y-6 animate-in fade-in duration-500">
                    {view === 'list' && (
                        <React.Fragment>
                            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
                                <div>
                                    <h2 class="text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                        📦 Control de Suministros
                                    </h2>
                                    <p class="text-slate-500 font-medium mt-2">Gestiona adquisiciones, compara proveedores y controla fechas de entrega.</p>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 w-full md:w-auto">
                                     <select 
                                         class="border border-slate-200 rounded-lg py-1.5 px-3 text-xs font-bold text-slate-700 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 min-w-[180px]"
                                         value={filtroObra}
                                         onChange={e => setFiltroObra(e.target.value)}
                                     >
                                         <option value="">🏢 Todas las Obras</option>
                                         {proyectos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                                     </select>

                                     <select 
                                         class="border border-slate-200 rounded-lg py-1.5 px-3 text-xs font-bold text-slate-700 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 min-w-[180px]"
                                         value={filtroEstado}
                                         onChange={e => setFiltroEstado(e.target.value)}
                                     >
                                         <option value="">📊 Todos los Estados</option>
                                         <option value="Cotización">1- Cotización</option>
                                         <option value="Revisión Proveedor">2- Revisión Proveedor</option>
                                         <option value="Generación O.C.">3- Generación O.C.</option>
                                         <option value="Pendiente de Recepción">4- Pendiente de Recepción</option>
                                         <option value="Recepcionado">5- Recepcionado</option>
                                         <option value="Anulado">Anulado</option>
                                     </select>

                                     <div class="relative min-w-[200px]">
                                         <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
                                         <input 
                                             type="text"
                                             placeholder="Proveedor..."
                                             class="w-full border border-slate-200 rounded-lg py-1.5 pl-8 pr-3 text-xs font-bold text-slate-700 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500"
                                             value={filtroProveedor}
                                             onChange={e => setFiltroProveedor(e.target.value)}
                                         />
                                     </div>

                                     <button 
                                         onClick={() => setView('evaluation')}
                                         class="bg-amber-100 hover:bg-amber-200 text-amber-700 px-4 py-1.5 rounded-lg font-black text-[11px] flex items-center justify-center gap-2 transition-all"
                                     >
                                         ⭐ Evaluación
                                     </button>

                                     <button 
                                         onClick={handleCreate}
                                         class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg font-black text-[11px] flex items-center justify-center gap-2 shadow-lg shadow-red-500/30 transition-all"
                                     >
                                         ➕ Nuevo
                                     </button>
                                </div>
                            </div>

                            <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-xl overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-50 border-b border-slate-100">
                                            <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                                <th class="px-6 py-4">ID Solicitud</th>
                                                <th class="px-6 py-4">Obra</th>
                                                <th class="px-6 py-4">N° Pedido</th>
                                                <th class="px-6 py-4">Insumo / Producto</th>
                                                <th class="px-6 py-4">Proveedor / Oferta</th>
                                                <th class="px-6 py-4 text-center">Estado</th>
                                                <th class="px-6 py-4 text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-50">
                                            {filteredSols.length === 0 ? (
                                                 <tr>
                                                     <td colSpan="7" class="px-6 py-12 text-center">
                                                         <div class="text-6xl mb-4">📦</div>
                                                         <p class="text-slate-500 font-bold">No hay solicitudes de suministros registradas.</p>
                                                         <button onClick={handleCreate} class="mt-4 text-indigo-600 font-bold hover:underline">Crear la primera solicitud</button>
                                                     </td>
                                                 </tr>
                                             ) : (
                                                 filteredSols.map(s => {
                                                     const obra = proyectos.find(p => String(p.id) === String(s.obraId));
                                                     const ganador = (s.comparativa || []).find(c => c.id === s.proveedorGanadorId);
                                                     const mejor = getMejorOpcion(s.comparativa || [], s.items || []);
                                                     const displayProv = ganador || mejor;
                                                     const totalCant = (s.items || []).reduce((acc, i) => acc + (i.cantidad || 0), 0);
                                                     const stateColors = {
                                                         'Cotización': 'bg-blue-100 text-blue-700 border-blue-200',
                                                         'Revisión Proveedor': 'bg-purple-100 text-purple-700 border-purple-200',
                                                         'Generación O.C.': 'bg-amber-100 text-amber-700 border-amber-200',
                                                         'Pendiente de Recepción': 'bg-orange-100 text-orange-700 border-orange-200',
                                                         'Recepcionado': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                                                         'Anulado': 'bg-rose-100 text-rose-700 border-rose-200'
                                                     };
                                                     return (
                                                         <tr key={s.id} class="hover:bg-slate-50 transition-colors">
                                                             <td class="px-6 py-4 text-xs font-bold text-slate-500">#{s.id.slice(-6)}</td>
                                                             <td class="px-6 py-4 font-bold text-slate-800 text-sm">{obra ? obra.nombre : 'Sin Obra'}</td>
                                                             <td class="px-6 py-4">
                                                                  <p class="text-[10px] font-black text-slate-600">P: {s.numPedidoCompra || '---'}</p>
                                                              </td>
                                                             <td class="px-6 py-4">
                                                                 <p class="font-black text-slate-800">{(s.items || []).length === 1 ? s.items[0].nombre : `${(s.items || []).length} Insumos`}</p>
                                                                 <p class="text-[10px] font-bold text-slate-400 uppercase">{totalCant} Unidades Totales</p>
                                                                 {s.evaluacion?.calificacion > 0 && (
                                                                     <span class="text-[9px] bg-yellow-100 text-yellow-700 px-1.5 rounded-full font-black border border-yellow-200">⭐ {s.evaluacion.calificacion}/5</span>
                                                                 )}
                                                             </td>
                                                             <td class="px-6 py-4">
                                                                 {displayProv ? (
                                                                     <div>
                                                                         <p class="font-bold text-indigo-700 text-sm">
                                                                             {displayProv.proveedorNombre || 'Sin Nombre'}
                                                                             {ganador && <span class="ml-2 text-[10px] bg-emerald-100 text-emerald-700 px-1 rounded-full">✓</span>}
                                                                         </p>
                                                                         <p class="text-[10px] font-black text-slate-500">Total: ${calculateTotalProv(displayProv, s.items).toLocaleString('es-CL')}</p>
                                                                     </div>
                                                                 ) : <span class="text-xs text-slate-400 italic">Sin cotizaciones validas</span>}
                                                             </td>
                                                             <td class="px-6 py-4 text-center">
                                                                 <span class={`px-3 py-1 rounded-full text-[10px] font-black border uppercase tracking-wider ${stateColors[s.estado] || 'bg-slate-100'}`}>
                                                                     {s.estado}
                                                                 </span>
                                                             </td>
                                                             <td class="px-6 py-4 text-center">
                                                                 <div class="flex items-center justify-center gap-2">
                                                                     <button onClick={() => handleEdit(s)} class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-colors flex items-center justify-center">✏️</button>
                                                                     <button onClick={() => handleDelete(s.id)} class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition-colors flex items-center justify-center">🗑️</button>
                                                                 </div>
                                                             </td>
                                                         </tr>
                                                     );
                                                 })
                                             )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </React.Fragment>
                    )}

                    {view === 'form' && formData && (
                        <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden w-full mx-auto">
                            <div class="bg-gradient-to-br from-red-700 via-red-600 to-red-800 p-10 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -mr-20 -mt-20 blur-3xl"></div>
                                <div class="relative flex items-center gap-6">

                let y2 = point.y * Math.cos(rotX) - z1 * Math.sin(rotX);
                let z2 = point.y * Math.sin(rotX) + z1 * Math.cos(rotX);
                const fov = 340;
                const distance = 250;
                const scale = fov / (distance + z2);
                return {
                    x: width / 2 + x1 * scale,
                    y: height / 2 + y2 * scale,
                    depth: z2
                };
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                ctx.clearRect(0, 0, w, h);

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for (let i = -140; i <= 140; i += 35) {
                    const p1 = project({ x: i, y: 70, z: -100 }, rotation.x, rotation.y, w, h);
                    const p2 = project({ x: i, y: 70, z: 100 }, rotation.x, rotation.y, w, h);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();

                    const p3 = project({ x: -140, y: 70, z: i * 0.7 }, rotation.x, rotation.y, w, h);
                    const p4 = project({ x: 140, y: 70, z: i * 0.7 }, rotation.x, rotation.y, w, h);
                    ctx.beginPath();
                    ctx.moveTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.stroke();
                }

                const elements = getBimElements();
                const projected = elements.map(el => {
                    const p1Proj = project(el.p1, rotation.x, rotation.y, w, h);
                    const p2Proj = project(el.p2, rotation.x, rotation.y, w, h);
                    const avgDepth = (p1Proj.depth + p2Proj.depth) / 2;
                    return { el, p1Proj, p2Proj, avgDepth };
                });

                projected.sort((a, b) => b.avgDepth - a.avgDepth);

                projected.forEach(({ el, p1Proj, p2Proj }) => {
                    const isSelected = selectedElement && selectedElement.id === el.id;
                    const isMapped = mappingData.some(m => m.id === el.id && m.mappedItem);

                    let strokeColor = '#3b82f6';
                    if (isSelected) {
                        strokeColor = '#f97316';
                    } else if (isMapped) {
                        strokeColor = '#22c55e';
                    }

                    ctx.strokeStyle = strokeColor;
                    if (isSelected) {
                        ctx.lineWidth = el.category === 'IfcFooting' ? 18 : el.category === 'IfcColumn' ? 10 : 8;
                    } else {
                        ctx.lineWidth = el.category === 'IfcFooting' ? 12 : el.category === 'IfcColumn' ? 6 : 3.5;
                    }
                    ctx.beginPath();
                    ctx.moveTo(p1Proj.x, p1Proj.y);
                    ctx.lineTo(p2Proj.x, p2Proj.y);
                    ctx.stroke();

                    if (isSelected) {
                        ctx.fillStyle = '#f97316';
                        ctx.beginPath();
                        ctx.arc(p1Proj.x, p1Proj.y, 4, 0, Math.PI * 2);
                        ctx.arc(p2Proj.x, p2Proj.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

            }, [rotation, selectedElement, mappingData]);

            useEffect(() => {
                if (!autoRotate || isDragging) return;
                const timer = setInterval(() => {
                    setRotation(prev => ({ ...prev, y: prev.y + 0.005 }));
                }, 30);
                return () => clearInterval(timer);
            }, [autoRotate, isDragging]);

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setDragStart({ x: e.clientX, y: e.clientY });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                setRotation(prev => ({
                    x: Math.max(-Math.PI / 3, Math.min(Math.PI / 3, prev.x + dy * 0.008)),
                    y: prev.y + dx * 0.008
                }));
                setDragStart({ x: e.clientX, y: e.clientY });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleCanvasClick = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const w = canvas.width;
                const h = canvas.height;

                const distToSegment = (px, py, ax, ay, bx, by) => {
                    const l2 = (ax - bx) ** 2 + (ay - by) ** 2;
                    if (l2 === 0) return Math.sqrt((px - ax) ** 2 + (py - ay) ** 2);
                    let t = ((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    return Math.sqrt((px - (ax + t * (bx - ax))) ** 2 + (py - (ay + t * (by - ay))) ** 2);
                };

                const elements = getBimElements();
                let closestEl = null;
                let minDist = 18;

                elements.forEach(el => {
                    const pt1 = project(el.p1, rotation.x, rotation.y, w, h);
                    const pt2 = project(el.p2, rotation.x, rotation.y, w, h);
                    const dist = distToSegment(mouseX, mouseY, pt1.x, pt1.y, pt2.x, pt2.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closestEl = el;
                    }
                });

                if (closestEl) {
                    const mapItem = mappingData.find(m => m.id === closestEl.id);
                    setSelectedElement({
                        ...closestEl,
                        mappedItem: mapItem ? mapItem.mappedItem : ''
                    });
                }

                const random = elements[Math.floor(Math.random() * elements.length)];
                const mapItem = mappingData.find(m => m.id === random.id);
                setSelectedElement({

                    mappedItem: mapItem ? mapItem.mappedItem : ''
                });

                            </div>

                                    {selectedElement ? (
